<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The published version, readable without running the app: fetching the page
     is enough to tell which build is live. This tag is the single source of
     truth — APP_VERSION reads it — so there is one number to bump, not two. -->
<meta name="app-version" content="1.9">
<title>HOKLAN QC</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a1a2c'/><text y='68' x='50' font-size='52' text-anchor='middle' fill='%232ea3f2' font-family='sans-serif' font-weight='bold'>QC</text></svg>">
<style>
:root{
  --bg:#050b14; --panel:rgba(11,24,41,.86); --ink:#e8eef6; --muted:#8fa6bf;
  --accent:#2ea3f2; --border:#1f3f63; --green:#2ecc71; --red:#ff5d55;
  --amber:#f5b942; --grey:#93a5b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  font-size:16px}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:1px}
h2{font-size:19px;margin:0 0 4px;color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px;letter-spacing:2px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;background:#0c1b2d;color:var(--ink);
  border:1px solid var(--border);border-radius:9px;padding:13px;font-size:16px;
  font-family:inherit;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
button{font-family:inherit;font-size:16px;border-radius:10px;border:1px solid var(--border);
  background:#143253;color:var(--ink);padding:14px;width:100%;font-weight:600}
button:active{transform:scale(.99)}
.primary{background:linear-gradient(90deg,#1c6fb0,#2ea3f2);border-color:#4fb8ff;
  color:#04121e;font-size:17px;padding:17px;letter-spacing:1px}
.row{display:flex;margin:0 -5px}
.row>*{flex:1;margin:0 5px}
.bar{height:8px;background:#0c1b2d;border-radius:5px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1c6fb0,#2ea3f2);
  transition:width .25s}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 38px;font-size:15.5px;
  line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;
  height:26px;border-radius:50%;background:var(--accent);color:#04121e;font-weight:700;
  font-size:14px;display:flex;align-items:center;justify-content:center}

/* Tabs. Only on the start screen and inside Admin: offering them mid-checklist
   would put a way to walk out of an unfinished inspection next to the answers. */
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{flex:1;background:transparent;border:1px solid var(--border);
  color:var(--grey);padding:12px 8px;font-size:14px;letter-spacing:.5px}
.tabs button.on{background:rgba(46,163,242,.16);border-color:var(--accent);
  color:var(--accent)}
/* The reference catalogue: one tappable row each, and there are fifty-odd of
   them, so the list is filterable and the rows are kept to one line. */
.rlist{display:flex;flex-direction:column;gap:6px}
.rlist button{display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:#0a1523;padding:12px;font-size:14.5px;font-weight:600;
  text-align:left}
.rlist button em{font-style:normal;font-size:10.5px;color:var(--grey);
  letter-spacing:1.5px;font-weight:700;white-space:nowrap}
/* One selectable test. The box on the left is drawn, not an <input>: a real
   checkbox cannot be styled consistently across Android and iOS. */
.pk{display:flex;align-items:center;gap:11px;background:#0a1523;padding:11px 12px;
  margin-bottom:6px;text-align:left;font-size:14.5px;font-weight:500}
.pk.on{border-color:var(--accent);background:rgba(46,163,242,.12)}
.pk i{font-style:normal;flex:none;width:22px;height:22px;border-radius:6px;
  border:1px solid var(--border);display:flex;align-items:center;
  justify-content:center;font-size:13px;color:#04121e;background:#0c1b2d}
.pk.on i{background:var(--accent);border-color:var(--accent)}
.pk b{flex:1;font-weight:500}
.pk em{font-style:normal;font-size:10.5px;color:var(--grey);font-weight:700}

.grp{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  margin-bottom:10px;overflow:hidden}
.grp.done{border-color:#2b6b46}
.grp.bad{border-color:#7a3a36}
.grp-h{display:flex;align-items:center;padding:13px 14px;cursor:pointer}
.grp-h b{flex:1;color:var(--ink);font-size:14.5px;font-weight:600}
.grp-h em{font-style:normal;font-size:11px;font-weight:700;padding:3px 9px;
  border-radius:6px;background:#10273f;color:var(--muted);margin-right:8px}
.grp-h em.ok{background:rgba(46,204,113,.18);color:var(--green)}
.grp-h em.bad{background:rgba(255,93,85,.18);color:var(--red)}
.grp-h i{font-style:normal;color:var(--muted);font-size:15px;width:18px;text-align:center}
.grp-b{padding:0 14px 12px}
.help-b{width:28px;height:28px;padding:0;flex:none;margin-right:8px;border-radius:8px;
  background:#14304a;border:1px solid #2b5f92;color:var(--accent);font-size:17px;
  font-weight:700;line-height:1}
.help-b.on{background:var(--accent);color:#04121e;border-color:var(--accent)}
.grp-help{margin:0 14px 12px;padding:11px;border-radius:9px;background:#0d1f33;
  border:1px solid #24466b;color:#cfe0f2;font-size:14px;line-height:1.55}
.na-btn{font-size:12px !important;letter-spacing:0}

/* One question, with a row per speaker underneath it */
.q{border-top:1px solid #16304d;padding-top:4px}
.q:first-child{border-top:none}
.q-h{font-size:14.5px;line-height:1.4;color:#e8f1fb;padding:9px 0 3px;
  font-weight:600}
.q .pt{border-top:none;padding:5px 0}
.q .pt u{flex:0 0 76px;margin-right:auto;text-decoration:none;font-size:11px;
  font-weight:700;letter-spacing:.5px;color:var(--accent);background:#0f2c47;
  border:1px solid #23507d;border-radius:5px;padding:5px 0;text-align:center}
.q .pt u + span{display:none}   /* the question is already written above */

.pt{display:flex;align-items:center;gap:0;padding:9px 0;
  border-top:1px solid #16304d}
.pt:first-child{border-top:none}
.pt span{flex:1;font-size:14.5px;line-height:1.35;padding-right:8px}
/* Evidence box for a failed point */
.pf{background:rgba(122,34,28,.28);border:1px solid var(--red);border-radius:9px;
  padding:11px;margin:2px 0 10px}
.pf-h{font-size:12px;font-weight:700;color:#ffc9c5;letter-spacing:.5px;
  margin-bottom:9px}
.pf textarea{min-height:64px;margin-top:9px;font-size:15px}
.pf-w{background:rgba(245,185,66,.16);border:1px solid var(--amber);
  border-radius:7px;padding:8px 10px;font-size:12.5px;color:#ffe9bd;margin-top:9px}
.pf-ok{background:rgba(30,120,70,.18);border:1px solid var(--green);
  border-radius:7px;padding:8px 10px;font-size:12.5px;color:#b6f0cd;margin-top:9px;
  font-weight:600}
/* Folded evidence: one green line, tappable to reopen */
.pf-c{display:flex;align-items:center;gap:8px;cursor:pointer;
  background:rgba(30,120,70,.16);border:1px solid var(--green);border-radius:9px;
  padding:9px 11px;margin:2px 0 10px}
.pf-c b{color:var(--green);font-size:14px;flex:none}
.pf-c span{flex:1;color:#b6f0cd;font-size:12.5px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-c i{color:var(--green);font-style:normal;font-size:13px;flex:none}
.p-help{width:auto;padding:4px 0 9px;background:none;border:none;
  color:var(--accent);font-size:12.5px;font-weight:600;text-align:left;
  letter-spacing:.3px}
.p-help.on{color:var(--muted)}
.pt-help{color:#cfe0f2;font-size:13.5px;line-height:1.55;
  border-left:2px solid var(--accent);padding:2px 0 11px 10px;margin:0 0 6px 2px}
.pt button{width:42px;padding:9px 0;font-size:16px;font-weight:700;flex:none;
  margin-left:5px;background:#0f2438;border-color:#26466b;color:var(--muted)}
.pt button.on-p{background:#14663a;border-color:var(--green);color:#d8ffe8}
.pt button.on-f{background:#7a221c;border-color:var(--red);color:#ffe3e1}
.pt button.on-n{background:#33414f;border-color:var(--grey);color:#e6edf4}

.shot{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px;margin-bottom:10px}
.shot.ok{border-color:#2b6b46}
.shot-head{display:flex;align-items:center;margin-bottom:9px}
.shot-head b{flex:1;font-size:15px}
.shot-head em{font-style:normal;font-size:11px;font-weight:700;padding:3px 8px;
  border-radius:6px;background:rgba(46,204,113,.18);color:var(--green)}
.shot-head em.miss{background:rgba(245,185,66,.18);color:var(--amber)}
.shot-head em.na{background:#33414f;color:#e6edf4}

.jump{background:none;border:none;color:var(--accent);font-size:13px;padding:6px 0;
  width:auto;text-align:left;font-weight:600}
.ix{display:flex;align-items:center;padding:14px 0;border-top:1px solid #16304d}
.ix:first-child{border-top:none}
.ix b{width:26px;color:var(--muted);font-size:13px;flex:none}
.ix span{flex:1;font-size:15px}
.ix i{font-style:normal;font-size:12px;color:var(--muted);display:block;margin-top:2px}
.ix em{font-style:normal;font-size:12px;font-weight:700;padding:4px 9px;
  border-radius:6px;background:#10273f;color:var(--muted);flex:none}
.ix em.PASS{background:rgba(46,204,113,.18);color:var(--green)}
.ix em.FAIL{background:rgba(255,93,85,.18);color:var(--red)}
.ix em.now{background:var(--accent);color:#04121e}

.media{display:flex;flex-wrap:wrap;margin:10px -5px 0}
.thumb{position:relative;width:78px;height:78px;border-radius:9px;overflow:hidden;
  border:1px solid var(--border);background:#0c1b2d;margin:0 5px 10px}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb b{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);
  font-size:10px;text-align:center;padding:2px;font-weight:400}
.thumb span{position:absolute;top:2px;right:2px;background:rgba(255,93,85,.9);
  width:20px;height:20px;border-radius:50%;font-size:13px;display:flex;
  align-items:center;justify-content:center;font-weight:700}

.actions{position:fixed;left:0;right:0;bottom:0;padding:10px 9px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 22%);display:flex;
  max-width:640px;margin:0 auto}
.actions>button{margin:0 5px}
.skip{font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:9px 4px;border-bottom:1px solid #16304d}
td:last-child{text-align:right;font-weight:700}
.PASS{color:var(--green)} .FAIL{color:var(--red)} .NA{color:var(--grey)}
.INCOMPLETE{color:var(--amber)}
.big{font-size:34px;font-weight:700;text-align:center;padding:20px;border-radius:12px;
  letter-spacing:3px;margin-bottom:14px}
.hint{color:var(--muted);font-size:13px;line-height:1.5;margin-top:10px}
.warn{background:rgba(122,34,28,.5);border:1px solid var(--red);border-radius:9px;
  padding:11px;font-size:14px;margin-top:10px}
.needed{background:rgba(245,185,66,.15);border:1px solid var(--amber);
  border-radius:9px;padding:11px;font-size:14px;margin-top:10px;color:#ffe9bd}
/* Always-reachable way back to the start screen, from anywhere in a long
   inspection. */
.totop{position:fixed;right:14px;width:auto;padding:9px 16px;border-radius:22px;
  bottom:calc(78px + env(safe-area-inset-bottom));background:#14304a;
  border:1px solid var(--accent);color:var(--accent);font-size:13px;
  font-weight:700;letter-spacing:1px;
  box-shadow:0 3px 12px rgba(0,0,0,.5);display:none;z-index:5}
.totop.show{display:block}
.hidden{display:none}
/* The English line under a note. Deliberately quiet: it is a reading aid for
   the office, not something the operator has to check. */
.en-line{font-size:12px;line-height:1.45;color:#8fa6bd;margin-top:6px;
  padding-left:8px;border-left:2px solid rgba(143,166,189,.35);
  white-space:pre-wrap}
/* No-JavaScript fallback */
.nojs{margin-top:60px;background:#10273f;border:1px solid var(--accent);
  border-radius:12px;padding:22px;text-align:center}
.nojs b{display:block;font-size:22px;letter-spacing:3px;color:var(--accent);
  margin-bottom:14px}
.nojs p{font-size:15px;line-height:1.6;color:#e8f1fb;margin:0 0 14px}
.nojs p.sm{font-size:13px;color:var(--muted);margin-bottom:0}
/* What the evidence should show. Stated where the camera button is, not in a
   manual: an instruction the operator reads three weeks before the photo does
   not change the photo. */
.ask{list-style:none;margin:0 0 11px;padding:0}
.ask li{font-size:12.5px;line-height:1.5;color:#bcd0e4;padding:5px 0 5px 11px;
  border-left:2px solid #23507d;margin-bottom:5px}
.ask li b{color:var(--accent);font-weight:600;margin-right:4px}
/* What the packet contains, listed before it is built */
.packet{list-style:none;margin:0 0 10px;padding:0}
.packet li{padding:7px 0 7px 12px;border-left:2px solid var(--accent);
  margin-bottom:6px;font-size:13px;line-height:1.45;color:#cfe0f2}
.packet li b{color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace}
/* How many speakers this inspection covers: 1-5, one tap */
.units{display:flex;gap:7px;margin-top:4px}
.units button{flex:1;padding:12px 0;font-size:17px;font-weight:700;
  background:#0f2438;border:1px solid #26466b;color:var(--muted);margin:0}
.units button.on{background:var(--accent);border-color:var(--accent);color:#04121f}
/* Which speaker is on the bench right now */
.unit-tag{display:inline-block;background:var(--accent);color:#04121f;
  border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;
  letter-spacing:.6px;margin-right:6px}
.tag{display:inline-block;background:#10273f;border:1px solid var(--border);
  border-radius:6px;padding:3px 9px;font-size:12px;color:var(--muted);margin-right:6px}
/* Result of the test-ID lookup: same weight in both directions, so a wrong
   code is as obvious as a right one. */
.code{margin:10px 0 0;padding:11px;border-radius:9px;text-align:center;
  font-size:17px;font-weight:700;letter-spacing:1px}
.code.ok{background:rgba(46,204,113,.15);border:1px solid var(--green);
  color:var(--green)}
.code.bad{background:rgba(255,93,85,.15);border:1px solid var(--red);
  color:var(--red);letter-spacing:0}
input.bad{border-color:var(--red)}
.lang{display:flex;justify-content:center;margin-bottom:14px}
/* Three languages have to fit on a 320 px screen, so the padding is tighter
   than a two-button bar would need. */
.lang button{width:auto;padding:7px 13px;margin:0 3px;font-size:13.5px;
  background:#0c1b2d;color:var(--muted)}
.lang button.on{background:var(--accent);color:#04121e;border-color:var(--accent)}
/* Compact variant for screens where the language switch must not take space
   away from the checklist itself. */
.lang.mini{justify-content:flex-end;margin-bottom:8px}
.lang.mini button{padding:4px 11px;margin:0 0 0 5px;font-size:11.5px;
  border-radius:7px}

#report{background:#fff;color:#16212e;padding:10px;border-radius:10px}
@media print{
  /* Browsers drop background colours when printing unless told otherwise, and
     the watermark is a background: without this it prints blank. */
  body{background:#fff;padding:0;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{max-width:none;padding:0}
  .actions,.noprint{display:none !important}
  #report{padding:0;border-radius:0}
}
</style>
</head>

<!-- Shown only where scripts do not run — WeChat's file preview on iPhone is
     the usual case. The first render() replaces it. A blank screen tells the
     operator nothing; this tells them exactly what to do. -->
<div class="wrap" id="app">
  <div class="nojs">
    <b>HOKLAN QC</b>
    <p>正在加载……如果一直显示本页面，请在 Safari 或 Chrome 中打开本页，
       并确认已启用 JavaScript。</p>
    <p>Loading… If this message stays on screen, open the page in Safari or
       Chrome and make sure JavaScript is enabled.</p>
    <p class="sm">微信内置浏览器：··· → 在浏览器中打开<br>
       WeChat in-app browser: ··· → Open in browser</p>
  </div>
</div>
<button id="toTop" class="totop" onclick="goHome()"></button>
<div class="actions" id="actions"></div>

<script>
/* ============================================================================
   HOKLAN QC — mobile inspection checklist
   ----------------------------------------------------------------------------
   Single file: no server, no build, no app store. Works offline once loaded,
   and "Add to home screen" makes it behave like an installed app.

   Bilingual, English and Simplified Chinese. Every operator-facing string is a
   {en, zh} pair; the language switch only changes what is displayed, never what
   is recorded, so a report written by a Chinese operator reads identically to
   one written by an English-speaking one.
============================================================================ */

const APP_VERSION =
  (document.querySelector('meta[name="app-version"]') || {}).content || "1.9";

/* ==== BEGIN GENERATED CONFIG ==== */
const CONFIG = {
  /* Test IDs. The operator types the three digits and the app completes the
     rest. The factory name is never shown or stored anywhere - only the code
     travels in the report, the file name and the spreadsheet. The short keys
     below are internal, used solely to filter the reference list. */
  "test_ids": {
    "583": {"code":"583-R7H9Y2M4E", "key":"RHY"},
    "741": {"code":"741-Y9I4S2I6N", "key":"YIS"},
    "926": {"code":"926-E4A7G2L9E", "key":"EAG"},
    "418": {"code":"418-V7T2R9U4S", "key":"LES"}
  },

  "models": {
    "HK-ARC101":"YIS","HK-ARC103":"YIS","HK-ARC104":"YIS",
    "HK-ARC104A2":"YIS","HK-ARC105":"YIS","HK-ARC105PLO":"YIS",
    "HK-ARC106A2":"YIS","HK-ARC108A2":"YIS","HK-BAS115A1":"RHY",
    "HK-BAS118A1":"RHY","HK-BRA208A1":"YIS","HK-BRA208B1":"YIS",
    "HK-BRA210A1":"YIS","HK-BRA210B1":"YIS","HK-BRA212B1":"YIS",
    "HK-DEC115A1":"RHY","HK-DEL101":"RHY","HK-DEL103":"RHY","HK-DEL103P":"RHY",
    "HK-DEL105":"RHY","HK-DEL110":"RHY","HK-DEL110B1":"RHY","HK-DEL115B1":"RHY",
    "HK-DEL210A1":"RHY","HK-EPS112A1":"RHY","HK-NOV01":"YIS",
    "HK-NOV01-ARG":"YIS","HK-NOV02":"YIS","HK-NOV02-ARG":"YIS",
    "HK-POW101":"YIS","HK-POW102":"YIS","HK-POW103":"YIS","HK-POW104":"YIS",
    "HK-RES101":"YIS","HK-RES102":"YIS","HK-RES103":"YIS","HK-RES104":"YIS",
    "HK-RES106":"YIS","HK-RES106B1":"YIS","HK-RES108B1":"YIS",
    "HK-RES109":"YIS","HK-RES115B2":"YIS","HK-RHO101":"LES",
    "HK-RHO102":"LES","HK-RHO102-BAG":"LES","HK-RNW101":"YIS",
    "HK-RNW102":"YIS","HK-RNW103":"YIS","HK-RNW105":"YIS",
    "HK-RNW212A2":"YIS","HK-SKA108A1":"YIS","HK-SKA108B1":"YIS",
    "HK-STB103":"EAG"
  },

  "failure_codes": {
    "PWR-001":{"en":"No power","zh":"无法开机","es":"No enciende"},
    "PWR-002":{"en":"Unexpected restart","zh":"异常重启","es":"Reinicio inesperado"},
    "PWR-003":{"en":"Unstable power","zh":"供电不稳定","es":"Alimentación inestable"},
    "PWR-004":{"en":"Display does not start","zh":"显示屏无法启动","es":"La pantalla no arranca"},
    "USB-001":{"en":"USB not recognised","zh":"无法识别 U 盘","es":"No reconoce la memoria USB"},
    "USB-002":{"en":"Does not play audio","zh":"无法播放音频","es":"No reproduce audio"},
    "USB-003":{"en":"Audio cuts out","zh":"声音中断","es":"El sonido se corta"},
    "USB-006":{"en":"Track change does not work","zh":"切换歌曲无效","es":"El cambio de pista no funciona"},
    "USB-007":{"en":"Hum or interference on USB","zh":"U 盘播放有杂音或干扰","es":"Zumbido o interferencia en USB"},

  "plans": {
    "default": {
      "plan_version": 3,
      "tests": [
        {"id":"USB","optional":false,
         "label":{"en":"USB","zh":"USB","es":"USB"},
         "steps":[
           {"en":"Insert the HOKLAN test USB drive into the speaker","zh":"将 HOKLAN 测试 U 盘插入音箱","es":"Inserte la memoria USB de prueba HOKLAN en el parlante"},
           {"en":"Select USB mode on the speaker","zh":"在音箱上切换到 USB 模式","es":"Seleccione el modo USB en el parlante"},
           {"en":"Wait until it reads the USB drive and starts playing","zh":"等待识别 U 盘并开始播放","es":"Espere hasta que lea la memoria y empiece a reproducir"},
           {"en":"Let the HOKLAN USB play, listening for dropouts","zh":"让测试音频播放，注意是否有中断","es":"Deje reproducir la USB HOKLAN, atento a cortes"},
           {"en":"With the USB drive playing, check each control on the list","zh":"在播放状态下，逐项检查下列功能","es":"Con la memoria reproduciendo, verifique cada control de la lista"},
           {"en":"Finally, switch the speaker off and on to see if it starts in USB","zh":"最后重新开机，确认是否自动进入 USB 模式","es":"Por último, apague y encienda el parlante para ver si arranca en USB"}],
         "points":[
           {"section":{"en":"Playback","zh":"播放","es":"Reproducción"},
            "help":{"en":"Insert the HOKLAN test USB and select USB mode. Wait until it reads the USB drive and plays. At the end, switch the speaker off and on to see whether it starts in USB by itself.",
                    "zh":"插入 HOKLAN 测试 U 盘并切换到 USB 模式，等待识别并播放。最后重新开机，确认是否自动进入 USB 播放。",
                    "es":"Inserte la USB de prueba HOKLAN y seleccione el modo USB. Espere hasta que lea la memoria y reproduzca. Al final, apague y encienda el parlante para ver si arranca en USB por sí solo."}},
           {"id":"recognized","code":"USB-001","label":{"en":"Speaker reads the USB drive and shows USB mode","zh":"识别 U 盘并显示 USB 模式","es":"El parlante lee la memoria USB y muestra el modo USB"},
            "help":{"en":"Insert the USB drive. Within a few seconds the display must switch to USB and show a track number. If it stays blank or keeps searching, it is a fail.",
                    "zh":"插入 U 盘后几秒内，显示屏应切换到 USB 并显示曲目编号。若一直空白或持续搜索，判定为不合格。",
                    "es":"Inserte la memoria. En pocos segundos la pantalla debe cambiar a USB y mostrar un número de pista. Si queda en blanco o sigue buscando, no conforme."}},
           {"id":"playback","code":"USB-002","label":{"en":"Plays the audio from the USB drive","zh":"播放 U 盘音频","es":"Reproduce el audio de la memoria USB"},
            "help":{"en":"Sound must start on its own, or after pressing play. Confirm it really comes out of the speaker, not from another speaker nearby.",
                    "zh":"应自动开始播放，或按播放键后出声。确认声音确实来自本机，而不是旁边的音箱。",
                    "es":"El sonido debe iniciar solo, o al pulsar reproducir. Confirme que sale realmente de este parlante y no de otro que esté al lado."}},
           {"id":"continuous","code":"USB-003","label":{"en":"No dropouts during playback","zh":"播放过程无中断","es":"Sin cortes durante la reproducción"},
            "help":{"en":"Let one full track play without touching anything. Listen for cuts, stutters or moments of silence.",
                    "zh":"完整播放一首曲目，中途不做任何操作。注意是否有断音、卡顿或瞬间静音。",
                    "es":"Deje sonar una pista completa sin tocar nada. Escuche si hay cortes, saltos o momentos de silencio."}},
           {"id":"quality","code":"USB-007","label":{"en":"No hum or interference","zh":"无杂音或干扰","es":"Sin zumbido ni interferencia"},
            "help":{"en":"Listen close to the grille at medium volume. Behind the music there must be no hum, hiss or crackle.",
                    "zh":"中等音量下靠近网罩细听，音乐背景不应有嗡嗡声、嘶声或爆音。",
                    "es":"Escuche cerca de la malla a volumen medio. Detrás de la música no debe haber zumbido, siseo ni crujidos."}},
           {"id":"autostart","code":"USB-014","label":{"en":"Starts in USB automatically on power on","zh":"开机自动进入 USB 播放","es":"Arranca en USB automáticamente al encender"},
            "help":{"en":"With the USB drive still inserted, switch the speaker off and on. It must return to USB mode and start playing without pressing anything.",
                    "zh":"U 盘保持插入，关机后再开机。应自动回到 USB 模式并开始播放，无需按任何键。",
                    "es":"Con la memoria aún insertada, apague y encienda el parlante. Debe volver al modo USB y empezar a reproducir sin pulsar nada."}},
           {"section":{"en":"Sound quality","zh":"音质","es":"Calidad de sonido"},
            "help":{"en":"Listen at medium and then high volume. Put your hand on the speaker to feel for abnormal vibration or rattles.",
                    "zh":"先中等音量再大音量试听。用手触摸箱体，感受是否有异常振动或杂音。",
                    "es":"Escuche a volumen medio y luego alto. Ponga la mano sobre el gabinete para sentir vibraciones anormales o traqueteos."}},
           {"id":"woofer","code":"AUD-001","label":{"en":"Woofer sounds","zh":"低音单元出声","es":"El woofer suena"},
            "help":{"en":"Play a track with bass. Hold your hand in front of the woofer and feel it move. The low end must be present and clean, not weak or muffled.",
                    "zh":"播放有低音的曲目，手放在低音单元前感受振动。低频应饱满干净，不应无力或发闷。",
                    "es":"Reproduzca una pista con graves. Ponga la mano frente al woofer y sienta el movimiento. El bajo debe estar presente y limpio, no débil ni apagado."}},
           {"id":"tweeter","code":"AUD-002","label":{"en":"Tweeter sounds","zh":"高音单元出声","es":"El tweeter suena"},
            "help":{"en":"Listen for cymbals and high detail. Cover the woofer with your hand: the treble must still be clearly audible.",
                    "zh":"注意听镲片和高频细节。用手挡住低音单元，高音仍应清晰可闻。",
                    "es":"Escuche los platillos y el detalle agudo. Tape el woofer con la mano: los agudos deben seguir oyéndose con claridad."}},
           {"id":"distortion","code":"AUD-003","label":{"en":"No distortion at high volume","zh":"大音量无失真","es":"Sin distorsión a volumen alto"},
            "help":{"en":"Raise the volume to maximum for a few seconds. The sound must stay clean, without breaking up, buzzing or going harsh.",
                    "zh":"将音量调到最大持续几秒。声音应保持干净，不破音、不嗡响、不刺耳。",
                    "es":"Suba el volumen al máximo unos segundos. El sonido debe mantenerse limpio, sin quebrarse, zumbar ni volverse estridente."}},
           {"id":"vibration","code":"AUD-004","label":{"en":"No abnormal speaker vibration","zh":"箱体无异常振动","es":"Sin vibración anormal del gabinete"},
            "help":{"en":"At high volume run your hand over the speaker, grille and back panel. Nothing must rattle, buzz or feel loose.",
                    "zh":"大音量时用手抚过箱体、网罩和后盖。不应有松动、嗡响或异常抖动。",
                    "es":"A volumen alto pase la mano por el gabinete, la malla y la tapa trasera. Nada debe traquetear, zumbar ni sentirse flojo."}},
           {"id":"strange_noise","code":"AUD-005","label":{"en":"No abnormal noise","zh":"无异响","es":"Sin ruidos anormales"},
            "help":{"en":"Pause the track with the speaker still on. The speakers must be silent: no hiss, hum or clicking.",
                    "zh":"保持开机并暂停播放。喇叭应完全安静，无嘶声、嗡声或咔哒声。",
                    "es":"Pause la pista con el parlante encendido. Los altavoces deben quedar en silencio: sin siseo, zumbido ni chasquidos."}},
           {"section":{"en":"Playback controls","zh":"播放控制","es":"Controles de reproducción"},
            "help":{"en":"With audio playing, press each button on the speaker and confirm it reacts: track, folder, play/pause, repeat, record and mode.",
                    "zh":"在播放状态下逐个按下音箱按键并确认反应：切歌、切文件夹、播放/暂停、循环、录音和模式。",
                    "es":"Con el audio sonando, pulse cada tecla del parlante y confirme que responde: pista, carpeta, reproducir/pausar, repetición, grabación y modo."}},
           {"id":"song_next","code":"USB-006","label":{"en":"Next track button","zh":"下一曲按键","es":"Tecla de pista siguiente"},
            "help":{"en":"Press it three times. The track number must advance one at a time and the music must change with each press.",
                    "zh":"连续按三次。曲目编号应逐一递增，每按一次音乐都要随之切换。",
                    "es":"Púlsela tres veces. El número de pista debe avanzar de uno en uno y la música debe cambiar con cada pulsación."}},
           {"id":"song_prev","code":"USB-006","label":{"en":"Previous track button","zh":"上一曲按键","es":"Tecla de pista anterior"},
            "help":{"en":"Press it three times. The track number must go back one at a time, not jump or restart from the beginning.",
                    "zh":"连续按三次。曲目编号应逐一递减，不应跳号或跳回第一首。",
                    "es":"Púlsela tres veces. El número de pista debe retroceder de uno en uno, sin saltos ni volver a la primera."}},
           {"id":"folder_next","code":"USB-011","label":{"en":"Next folder button","zh":"下一文件夹按键","es":"Tecla de carpeta siguiente"},
            "help":{"en":"Press it and confirm the folder number changes and playback jumps to a different folder on the USB drive.",
                    "zh":"按下后确认文件夹编号变化，并跳到 U 盘上的另一个文件夹播放。",
                    "es":"Púlsela y confirme que el número de carpeta cambia y la reproducción salta a otra carpeta de la memoria."}},
           {"id":"folder_prev","code":"USB-011","label":{"en":"Previous folder button","zh":"上一文件夹按键","es":"Tecla de carpeta anterior"},
            "help":{"en":"Press it and confirm it returns to the previous folder, not to the start of the USB drive.",
                    "zh":"按下后确认返回上一个文件夹，而不是回到 U 盘开头。",
                    "es":"Púlsela y confirme que vuelve a la carpeta anterior, no al inicio de la memoria."}},
           {"id":"play_pause","code":"USB-010","label":{"en":"PLAY / PAUSE button","zh":"播放/暂停按键","es":"Tecla PLAY / PAUSE"},
            "help":{"en":"Press once: the sound must stop and the display must show pause. Press again: it must resume from the same point, not from the start.",
                    "zh":"按一次，声音应停止且屏幕显示暂停；再按一次应从原位置继续，而不是从头播放。",
                    "es":"Pulse una vez: el sonido debe detenerse y la pantalla mostrar pausa. Pulse otra vez: debe continuar desde el mismo punto, no desde el inicio."}},
           {"id":"repeat","code":"USB-012","label":{"en":"Repeat one / all button","zh":"单曲/全部循环按键","es":"Tecla de repetición una / todas"},
            "help":{"en":"Set repeat-one and let the track end: the same track must play again. Then set repeat-all: at the end it must move to the next track.",
                    "zh":"设为单曲循环，让曲目播完：应重复播放同一首。再设为全部循环：播完应自动进入下一首。",
                    "es":"Ponga repetir-una y deje terminar la pista: debe volver a sonar la misma. Luego ponga repetir-todas: al terminar debe pasar a la siguiente."}},
           {"id":"record","code":"USB-013","label":{"en":"REC button: records and saves to the USB drive","zh":"REC 录音按键：保存到 U 盘","es":"Tecla REC: graba y guarda en la memoria USB"},
            "help":{"en":"Press REC, speak into the microphone for a few seconds, then stop. Play the recording back on the speaker to confirm the file was really saved.",
                    "zh":"按 REC，对着麦克风说几秒后停止。在音箱上回放该录音，确认文件确实已保存。",
                    "es":"Pulse REC, hable al micrófono unos segundos y detenga. Reproduzca la grabación en el parlante para confirmar que el archivo quedó guardado."}},
           {"id":"modes","code":"DSP-005","label":{"en":"Mode button","zh":"模式按键","es":"Tecla de modo"},
            "help":{"en":"Press the mode button through the full cycle until it returns to USB. The display must follow every change.",
                    "zh":"反复按模式键走完一轮回到 USB。显示屏应随每一次切换变化。",
                    "es":"Pulse la tecla de modo un ciclo completo hasta volver a USB. La pantalla debe seguir cada cambio."}},
           {"section":{"en":"Audio controls","zh":"音频控制","es":"Controles de audio"},
            "help":{"en":"Move each control through its full range and check the on-screen indicator follows it.",
                    "zh":"将每个旋钮从最小转到最大，确认屏幕显示同步变化。",
                    "es":"Mueva cada control en todo su recorrido y verifique que el indicador en pantalla lo siga."}},
           {"id":"volume_max","code":"AUD-006","label":{"en":"Volume to maximum and its on-screen indicator","zh":"音量调到最大及屏幕显示","es":"Volumen al máximo y su indicador en pantalla"},
            "help":{"en":"Take the volume from minimum to maximum slowly. The number on the display must follow the whole way, with no jumps, dead spots or scratchy sound.",
                    "zh":"缓慢将音量从最小调到最大。屏幕数值应全程同步变化，不应跳数、无死区、无刮擦杂音。",
                    "es":"Lleve el volumen del mínimo al máximo lentamente. El número en pantalla debe seguirlo en todo el recorrido, sin saltos, zonas muertas ni sonido rasposo."}},
           {"id":"treble","code":"AUD-007","label":{"en":"Treble level and its on-screen indicator","zh":"高音调节及屏幕显示","es":"Nivel de agudos y su indicador en pantalla"},
            "help":{"en":"With music playing, take the treble fully down and fully up. The change must be clearly audible and the indicator must follow it.",
                    "zh":"播放音乐时，将高音从最小调到最大。声音变化应清晰可辨，指示应同步变化。",
                    "es":"Con música sonando, lleve los agudos al mínimo y al máximo. El cambio debe oírse con claridad y el indicador debe seguirlo."}},
           {"id":"bass","code":"AUD-008","label":{"en":"Bass level and its on-screen indicator","zh":"低音调节及屏幕显示","es":"Nivel de graves y su indicador en pantalla"},
            "help":{"en":"With music playing, take the bass fully down and fully up. The change must be clearly audible and the indicator must follow it.",
                    "zh":"播放音乐时，将低音从最小调到最大。声音变化应清晰可辨，指示应同步变化。",
                    "es":"Con música sonando, lleve los graves al mínimo y al máximo. El cambio debe oírse con claridad y el indicador debe seguirlo."}},
           {"id":"xbass","code":"AUD-010","only":["HK-BRA210B1"],
            "label":{"en":"X-BASS function","zh":"X-BASS 功能","es":"Función X-BASS"},
            "help":{"en":"Playing from the USB drive, switch X-BASS on and off several times. The low end must jump noticeably when it is on and go back when it is off, and the display must show the change. Then raise the volume to maximum with X-BASS on: the bass must stay clean, with no distortion and no rattle from the woofer.",
                    "zh":"用 U 盘播放时，反复开关 X-BASS。开启时低音应明显增强，关闭时恢复原状，屏幕应显示状态变化。随后在开启 X-BASS 的状态下将音量调到最大：低音应保持干净，不失真，低音单元不应有异响。",
                    "es":"Reproduciendo desde la memoria USB, active y desactive X-BASS varias veces. El bajo debe aumentar notoriamente al activarlo y volver a su estado al desactivarlo, y la pantalla debe mostrar el cambio. Luego suba el volumen al máximo con X-BASS activo: el bajo debe mantenerse limpio, sin distorsión y sin traqueteo del woofer."}},
           {"section":{"en":"Microphones and guitar","zh":"麦克风与吉他","es":"Micrófonos y guitarra"},
            "help":{"en":"Plug a microphone into MIC1 and speak while you adjust volume, echo and priority. Repeat with MIC2, then connect the guitar. Mark N/A for whatever this reference does not have.",
                    "zh":"将麦克风插入 MIC1，一边说话一边调节音量、混响和优先键；MIC2 重复同样操作，最后接上吉他。本型号没有的功能标记为“不适用”。",
                    "es":"Conecte un micrófono en MIC1 y hable mientras ajusta volumen, eco y prioridad. Repita con MIC2 y luego conecte la guitarra. Marque N/A lo que esta referencia no tenga."}},
           {"id":"mic1_priority","code":"MIC-005","label":{"en":"MIC1 priority button","zh":"麦克风 1 优先键","es":"Tecla de prioridad de MIC1"},
            "help":{"en":"With music playing, press priority and speak into MIC1. The music must drop while you speak and come back when you stop.",
                    "zh":"在播放音乐时按下优先键并对麦克风 1 说话。说话时音乐应自动减小，停止后恢复。",
                    "es":"Con música sonando, pulse prioridad y hable por MIC1. La música debe bajar mientras habla y volver cuando pare."}},
           {"id":"mic2_priority","code":"MIC-005","label":{"en":"MIC2 priority button","zh":"麦克风 2 优先键","es":"Tecla de prioridad de MIC2"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。",
                    "es":"La misma prueba con MIC2. Marque N/A si esta referencia tiene una sola entrada de micrófono."}},
           {"id":"mic1_volume","code":"MIC-006","label":{"en":"MIC1 volume","zh":"麦克风 1 音量","es":"Volumen de MIC1"},
            "help":{"en":"Speak continuously into MIC1 while turning its volume from minimum to maximum. The level must rise smoothly, without cutting out or crackling.",
                    "zh":"对麦克风 1 持续说话，同时把音量从最小调到最大。音量应平滑上升，不应中断或有爆音。",
                    "es":"Hable de forma continua por MIC1 mientras gira su volumen del mínimo al máximo. El nivel debe subir de forma suave, sin cortes ni crujidos."}},
           {"id":"mic2_volume","code":"MIC-006","label":{"en":"MIC2 volume","zh":"麦克风 2 音量","es":"Volumen de MIC2"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。",
                    "es":"La misma prueba con MIC2. Marque N/A si esta referencia tiene una sola entrada de micrófono."}},
           {"id":"mic1_echo","code":"MIC-007","label":{"en":"MIC1 echo","zh":"麦克风 1 回声","es":"Eco de MIC1"},
            "help":{"en":"Say short words into MIC1 and turn the echo up. The repetition must become clearly audible, and disappear when turned down.",
                    "zh":"对麦克风 1 说短词并加大回声。重复声应明显可闻，调回最小时应消失。",
                    "es":"Diga palabras cortas por MIC1 y suba el eco. La repetición debe oírse con claridad y desaparecer al bajarlo."}},
           {"id":"mic2_echo","code":"MIC-007","label":{"en":"MIC2 echo","zh":"麦克风 2 回声","es":"Eco de MIC2"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。",
                    "es":"La misma prueba con MIC2. Marque N/A si esta referencia tiene una sola entrada de micrófono."}},
           {"id":"mic1_reverb","code":"MIC-008","label":{"en":"MIC1 reverb","zh":"麦克风 1 混响","es":"Reverberación de MIC1"},
            "help":{"en":"Speak into MIC1 and raise the reverb. The voice must gain body and depth, not repeat like the echo. Both controls must act independently.",
                    "zh":"对麦克风 1 说话并加大混响。人声应变得更有空间感和厚度，而不是像回声那样重复。两个旋钮应各自独立起作用。",
                    "es":"Hable por MIC1 y suba la reverberación. La voz debe ganar cuerpo y profundidad, no repetirse como el eco. Los dos controles deben actuar de forma independiente."}},
           {"id":"mic2_reverb","code":"MIC-008","label":{"en":"MIC2 reverb","zh":"麦克风 2 混响","es":"Reverberación de MIC2"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。",
                    "es":"La misma prueba con MIC2. Marque N/A si esta referencia tiene una sola entrada de micrófono."}},
           {"id":"guitar","code":"AUD-009","label":{"en":"Guitar volume","zh":"吉他音量","es":"Volumen de guitarra"},
            "help":{"en":"Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.",
                    "zh":"将吉他插入专用接口，一边弹奏一边把吉他音量从最小调到最大。本型号没有吉他接口时标记为“不适用”。",
                    "es":"Conecte la guitarra en su entrada y toque mientras mueve su control de volumen del mínimo al máximo. Marque N/A si esta referencia no tiene entrada de guitarra."}},
           {"section":{"en":"Lights","zh":"灯光","es":"Luces"},
            "help":{"en":"Switch the light on and off, and step through the light modes if the speaker has them.",
                    "zh":"开关灯光，如有多种灯光模式请逐一切换确认。",
                    "es":"Encienda y apague la luz, y recorra los modos de luz si el parlante los tiene."}},
           {"id":"light","code":"LED-006","label":{"en":"Light on / off","zh":"灯光开关","es":"Encendido / apagado de la luz"},
            "help":{"en":"Press the light button several times. It must switch on and off cleanly every time, with no flicker and no LED left lit.",
                    "zh":"多次按下灯光键。每次都应干脆地开和关，不闪烁，也不应有个别灯珠残亮。",
                    "es":"Pulse la tecla de luz varias veces. Debe encender y apagar de forma limpia cada vez, sin parpadeos y sin que quede ningún LED prendido."}},
           {"id":"light_pattern","code":"LED-007","label":{"en":"Light pattern change","zh":"灯光模式切换","es":"Cambio de patrón de luz"},
            "help":{"en":"Step through every light pattern and back to the first. Each one must be visibly different, with no dead LEDs in any pattern.",
                    "zh":"逐一切换所有灯光模式并回到第一个。每种模式应有明显区别，且任何模式下都不应有不亮的灯珠。",
                    "es":"Recorra todos los patrones de luz y vuelva al primero. Cada uno debe ser visiblemente distinto, sin LED apagados en ningún patrón."}},
           {"section":{"en":"AC charging","zh":"AC 充电","es":"Carga AC"},
            "help":{"en":"Connect the AC charging cable with the speaker switched on and watch the display.",
                    "zh":"在开机状态下接上 AC 充电线，观察显示屏。",
                    "es":"Conecte el cable de carga AC con el parlante encendido y observe la pantalla."}},
           {"id":"ac_charge","code":"CHG-002","label":{"en":"Charging indicator","zh":"充电指示","es":"Indicador de carga"},
            "help":{"en":"Plug the AC cable in. The charging indicator must appear on the display within a few seconds, and stay on while the cable is connected.",
                    "zh":"接上 AC 充电线。几秒内显示屏应出现充电指示，并在连接期间保持显示。",
                    "es":"Conecte el cable AC. El indicador de carga debe aparecer en la pantalla en pocos segundos y mantenerse mientras el cable esté conectado."}}]},

           {"id":"recognized","code":"SD-001","label":{"en":"Speaker reads the card and shows SD mode","zh":"识别 SD 卡并显示 SD 模式"},

           {"id":"continuous","code":"SD-003","label":{"en":"No dropouts during playback","zh":"播放过程无中断"},

                    "zh":"完整播放一首曲目，中途不做任何操作。注意是否有断音、卡顿或瞬间静音。"}},
           {"id":"quality","code":"SD-007","label":{"en":"No hum or interference","zh":"无杂音或干扰"},
            "help":{"en":"Listen close to the grille at medium volume. Behind the music there must be no hum, hiss or crackle.",
                    "zh":"中等音量下靠近网罩细听，音乐背景不应有嗡嗡声、嘶声或爆音。"}},
           {"id":"autostart","code":"SD-014","label":{"en":"Starts in SD automatically on power on","zh":"开机自动进入 SD 播放"},
            "help":{"en":"With the card still inserted, switch the speaker off and on. It must return to SD mode and start playing without pressing anything.",

           {"section":{"en":"Playback controls","zh":"播放控制"},
            "help":{"en":"With audio playing, press each button on the speaker and confirm it reacts: track, folder, play/pause, repeat, record and mode.",

           {"id":"song_next","code":"SD-006","label":{"en":"Next track button","zh":"下一曲按键"},
            "help":{"en":"Press it three times. The track number must advance one at a time and the music must change with each press.",
                    "zh":"连续按三次。曲目编号应逐一递增，每按一次音乐都要随之切换。"}},
           {"id":"song_prev","code":"SD-006","label":{"en":"Previous track button","zh":"上一曲按键"},
            "help":{"en":"Press it three times. The track number must go back one at a time, not jump or restart from the beginning.",
                    "zh":"连续按三次。曲目编号应逐一递减，不应跳号或跳回第一首。"}},
           {"id":"folder_next","code":"SD-011","label":{"en":"Next folder button","zh":"下一文件夹按键"},
            "help":{"en":"Press it and confirm the folder number changes and playback jumps to a different folder on the card.",
                    "zh":"按下后确认文件夹编号变化，并跳到卡上的另一个文件夹播放。"}},
           {"id":"folder_prev","code":"SD-011","label":{"en":"Previous folder button","zh":"上一文件夹按键"},
            "help":{"en":"Press it and confirm it returns to the previous folder, not to the start of the card.",
                    "zh":"按下后确认返回上一个文件夹，而不是回到卡的开头。"}},
           {"id":"play_pause","code":"SD-010","label":{"en":"PLAY / PAUSE button","zh":"播放/暂停按键"},
            "help":{"en":"Press once: the sound must stop and the display must show pause. Press again: it must resume from the same point.",
                    "zh":"按一次，声音应停止且屏幕显示暂停；再按一次应从原位置继续播放。"}},
           {"id":"repeat","code":"SD-012","label":{"en":"Repeat one / all button","zh":"单曲/全部循环按键"},
            "help":{"en":"Set repeat-one and let the track end: the same track must play again. Then set repeat-all: at the end it must move to the next track.",
                    "zh":"设为单曲循环，让曲目播完：应重复播放同一首。再设为全部循环：播完应自动进入下一首。"}},
           {"id":"record","code":"SD-013","label":{"en":"REC button: records and saves to the SD","zh":"REC 录音按键：保存到 SD 卡"},

           {"id":"erase","code":"SD-015","label":{"en":"Delete recordings button","zh":"删除录音按键"},
            "help":{"en":"Delete the recording you just made and confirm it no longer plays back. The music tracks must remain untouched.",

           {"id":"mic2_echo","code":"MIC-007","label":{"en":"MIC2 echo","zh":"麦克风 2 回声"},

           {"id":"mic1_reverb","code":"MIC-008","label":{"en":"MIC1 reverb","zh":"麦克风 1 混响"},

                    "zh":"对麦克风 1 说话并加大混响。人声应变得更有空间感和厚度，而不是像回声那样重复。两个旋钮应各自独立起作用。"}},

            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"guitar","code":"AUD-009","label":{"en":"Guitar volume","zh":"吉他音量"},
            "help":{"en":"Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.",
                    "zh":"将吉他插入专用接口，一边弹奏一边把吉他音量从最小调到最大。本型号没有吉他接口时标记为“不适用”。"}},
           {"section":{"en":"Lights","zh":"灯光"},

                    "zh":"开关灯光，如有多种灯光模式请逐一切换确认。"}},
           {"id":"light","code":"LED-006","label":{"en":"Light on / off","zh":"灯光开关"},
            "help":{"en":"Press the light button several times. It must switch on and off cleanly every time, with no flicker and no LED left lit.",

           {"id":"light_pattern","code":"LED-007","label":{"en":"Light pattern change","zh":"灯光模式切换"},

        {"id":"BLUETOOTH","optional":false,
         "label":{"en":"BLUETOOTH","zh":"蓝牙"},
         "steps":[
           {"en":"Put the speaker in Bluetooth mode and leave it discoverable","zh":"将音箱切换到蓝牙模式并保持可被搜索"},
           {"en":"Pair an iPhone and play audio","zh":"配对 iPhone 并播放音频"},
           {"en":"Disconnect, pair an Android phone and play audio","zh":"断开后配对安卓手机并播放音频"},
           {"en":"Switch the speaker off and on to see if it reconnects by itself","zh":"重新开机，确认是否自动回连"},
           {"en":"With the audio playing, check each control on the list","zh":"在播放状态下，逐项检查下列功能"},
           {"en":"Finally, enable TWS mode and link it to a second speaker","zh":"最后开启 TWS 模式，与第二台音箱串联"}],
         "points":[
           {"section":{"en":"Connection","zh":"连接"},
            "help":{"en":"Put the speaker in Bluetooth mode. Pair an iPhone and play; then disconnect and pair an Android. Finally switch the speaker off and on to see whether it reconnects by itself.",
                    "zh":"将音箱切换到蓝牙模式。先配对 iPhone 播放，断开后再配对安卓手机。最后重新开机，确认是否自动回连。"}},
           {"id":"iphone","code":"BT-006","label":{"en":"Connection with iPhone","zh":"连接 iPhone"},
            "help":{"en":"Search from the iPhone. The speaker must appear in the list, pair without a PIN and connect within a few seconds.",
                    "zh":"用 iPhone 搜索。音箱应出现在列表中，无需 PIN 码即可配对，并在几秒内连接成功。"}},
           {"id":"android","code":"BT-007","label":{"en":"Connection with Android","zh":"连接安卓手机"},
            "help":{"en":"Disconnect the iPhone first, then pair an Android. Both must work: it is common for a speaker to connect with one and fail with the other.",
                    "zh":"先断开 iPhone，再配对安卓手机。两者都必须正常：只连其中一种的情况很常见。"}},
           {"id":"autoconnect","code":"BT-008","label":{"en":"Reconnects automatically on power on","zh":"开机自动回连"},
            "help":{"en":"With the phone paired and nearby, switch the speaker off and on. It must reconnect by itself, without pairing again.",
                    "zh":"手机保持已配对且在附近，关机后再开机。音箱应自动回连，无需重新配对。"}},
           {"id":"stable","code":"BT-003","label":{"en":"Does not disconnect during playback","zh":"播放中不断开"},
            "help":{"en":"Play for at least 30 seconds with the phone about 3 metres away. There must be no dropouts or disconnections.",
                    "zh":"手机放在约 3 米外，持续播放至少 30 秒。不应出现断音或断开连接。"}},
           {"section":{"en":"Playback","zh":"播放"},
            "help":{"en":"Play the test track from the phone and listen for at least 30 seconds, checking for dropouts and hum.",
                    "zh":"用手机播放测试音乐，至少试听 30 秒，注意是否有断音或杂音。"}},
           {"id":"audio","code":"BT-004","label":{"en":"Audio comes out of the speaker","zh":"音箱正常出声"},
            "help":{"en":"A connected phone does not prove sound. Play music and confirm it really comes out of this speaker, not the phone or a nearby speaker.",
                    "zh":"连接成功不等于有声音。播放音乐并确认声音确实来自本机，而不是手机或旁边的音箱。"}},
           {"id":"quality","code":"BT-011","label":{"en":"No hum or interference","zh":"无杂音或干扰"},
            "help":{"en":"Listen close to the grille at medium volume. Behind the music there must be no hum, hiss or digital crackle.",
                    "zh":"中等音量下靠近网罩细听，音乐背景不应有嗡嗡声、嘶声或数字爆音。"}},
           {"id":"play_pause","code":"BT-009","label":{"en":"PLAY / PAUSE button","zh":"播放/暂停按键"},
            "help":{"en":"Press it on the speaker, not on the phone. The music must pause and the phone must show it paused too.",
                    "zh":"在音箱上按，不要在手机上按。音乐应暂停，手机端也应显示暂停。"}},
           {"id":"modes","code":"DSP-005","label":{"en":"Mode button","zh":"模式按键"},
            "help":{"en":"Press the mode button through the full cycle until it returns to Bluetooth. The connection must survive the round trip.",
                    "zh":"反复按模式键走完一轮回到蓝牙。切换一圈后连接不应断开。"}},
           {"section":{"en":"Audio controls","zh":"音频控制"},
            "help":{"en":"Move each control through its full range and check the on-screen indicator follows it.",
                    "zh":"将每个旋钮从最小转到最大，确认屏幕显示同步变化。"}},
           {"id":"volume_max","code":"AUD-006","label":{"en":"Volume to maximum and its on-screen indicator","zh":"音量调到最大及屏幕显示"},
            "help":{"en":"Take the volume from minimum to maximum slowly. The number on the display must follow the whole way, with no jumps, dead spots or scratchy sound.",
                    "zh":"缓慢将音量从最小调到最大。屏幕数值应全程同步变化，不应跳数、无死区、无刮擦杂音。"}},
           {"id":"treble","code":"AUD-007","label":{"en":"Treble level and its on-screen indicator","zh":"高音调节及屏幕显示"},
            "help":{"en":"With music playing, take the treble fully down and fully up. The change must be clearly audible and the indicator must follow it.",
                    "zh":"播放音乐时，将高音从最小调到最大。声音变化应清晰可辨，指示应同步变化。"}},
           {"id":"bass","code":"AUD-008","label":{"en":"Bass level and its on-screen indicator","zh":"低音调节及屏幕显示"},

                    "zh":"播放音乐时，将低音从最小调到最大。声音变化应清晰可辨，指示应同步变化。"}},
           {"id":"xbass","code":"AUD-010","only":["HK-BRA210B1"],
            "label":{"en":"X-BASS function","zh":"X-BASS 功能"},
            "help":{"en":"Playing over Bluetooth, switch X-BASS on and off several times. The low end must jump noticeably when it is on and go back when it is off, and the display must show the change. Then raise the volume to maximum with X-BASS on: the bass must stay clean, with no distortion and no rattle from the woofer.",
                    "zh":"通过蓝牙播放时，反复开关 X-BASS。开启时低音应明显增强，关闭时恢复原状，屏幕应显示状态变化。随后在开启 X-BASS 的状态下将音量调到最大：低音应保持干净，不失真，低音单元不应有异响。"}},
           {"section":{"en":"Microphones and guitar","zh":"麦克风与吉他"},

           {"id":"mic1_priority","code":"MIC-005","label":{"en":"MIC1 priority button","zh":"麦克风 1 优先键"},
            "help":{"en":"With music playing, press priority and speak into MIC1. The music must drop while you speak and come back when you stop.",
                    "zh":"在播放音乐时按下优先键并对麦克风 1 说话。说话时音乐应自动减小，停止后恢复。"}},
           {"id":"mic2_priority","code":"MIC-005","label":{"en":"MIC2 priority button","zh":"麦克风 2 优先键"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"mic1_volume","code":"MIC-006","label":{"en":"MIC1 volume","zh":"麦克风 1 音量"},
            "help":{"en":"Speak continuously into MIC1 while turning its volume from minimum to maximum. The level must rise smoothly, without cutting out or crackling.",
                    "zh":"对麦克风 1 持续说话，同时把音量从最小调到最大。音量应平滑上升，不应中断或有爆音。"}},
           {"id":"mic2_volume","code":"MIC-006","label":{"en":"MIC2 volume","zh":"麦克风 2 音量"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"mic1_echo","code":"MIC-007","label":{"en":"MIC1 echo","zh":"麦克风 1 回声"},

           {"id":"mic2_echo","code":"MIC-007","label":{"en":"MIC2 echo","zh":"麦克风 2 回声"},

                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"mic1_reverb","code":"MIC-008","label":{"en":"MIC1 reverb","zh":"麦克风 1 混响"},

                    "zh":"对麦克风 1 说话并加大混响。人声应变得更有空间感和厚度，而不是像回声那样重复。两个旋钮应各自独立起作用。"}},
           {"id":"mic2_reverb","code":"MIC-008","label":{"en":"MIC2 reverb","zh":"麦克风 2 混响"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"guitar","code":"AUD-009","label":{"en":"Guitar volume","zh":"吉他音量"},
            "help":{"en":"Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.",
                    "zh":"将吉他插入专用接口，一边弹奏一边把吉他音量从最小调到最大。本型号没有吉他接口时标记为“不适用”。"}},
           {"section":{"en":"Lights","zh":"灯光"},
            "help":{"en":"Switch the light on and off, and step through the light modes if the speaker has them.",

           {"id":"light","code":"LED-006","label":{"en":"Light on / off","zh":"灯光开关"},

           {"id":"light_pattern","code":"LED-007","label":{"en":"Light pattern change","zh":"灯光模式切换"},

                    "zh":"对麦克风 1 说短词并加大回声。重复声应明显可闻，调回最小时应消失。"}},
           {"id":"mic2_echo","code":"MIC-007","label":{"en":"MIC2 echo","zh":"麦克风 2 回声"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"mic1_reverb","code":"MIC-008","label":{"en":"MIC1 reverb","zh":"麦克风 1 混响"},
            "help":{"en":"Speak into MIC1 and raise the reverb. The voice must gain body and depth, not repeat like the echo. Both controls must act independently.",
                    "zh":"对麦克风 1 说话并加大混响。人声应变得更有空间感和厚度，而不是像回声那样重复。两个旋钮应各自独立起作用。"}},
           {"id":"mic2_reverb","code":"MIC-008","label":{"en":"MIC2 reverb","zh":"麦克风 2 混响"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"guitar","code":"AUD-009","label":{"en":"Guitar volume","zh":"吉他音量"},
            "help":{"en":"Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.",
                    "zh":"将吉他插入专用接口，一边弹奏一边把吉他音量从最小调到最大。本型号没有吉他接口时标记为“不适用”。"}},
           {"section":{"en":"Lights","zh":"灯光"},
            "help":{"en":"Switch the light on and off, and step through the light modes if the speaker has them.",
                    "zh":"开关灯光，如有多种灯光模式请逐一切换确认。"}},
           {"id":"lights_off","code":"FM-009","label":{"en":"Lights stay off in radio mode","zh":"收音模式下灯光保持关闭"},
            "help":{"en":"In radio mode the lights must stay off by design: the LED drivers interfere with FM reception. If they come on, it is a firmware fault.",
                    "zh":"收音模式下灯光应按设计保持关闭：灯板驱动会干扰调频接收。若灯亮起，属于固件缺陷。"}}]},

        {"id":"AUX","optional":false,
         "label":{"en":"AUX LINE","zh":"AUX 音频输入"},
         "steps":[
           {"en":"Select AUX mode on the speaker first","zh":"先在音箱上切换到 AUX 模式"},
           {"en":"Connect the AUX cable between the test source and the speaker","zh":"再用音频线连接测试音源与音箱 AUX 接口"},
           {"en":"Play audio from the source and confirm it comes out of the speaker","zh":"播放音源并确认音箱出声"},
           {"en":"With the audio playing, check each control on the list","zh":"在播放状态下，逐项检查下列功能"}],
         "points":[
           {"section":{"en":"AUX input","zh":"AUX 输入"},
            "help":{"en":"Connect the AUX cable between the test source and the speaker, select AUX mode and play audio.",
                    "zh":"用音频线连接测试音源与音箱 AUX 接口，切换到 AUX 模式并播放。"}},
           {"id":"input","code":"AUX-001","label":{"en":"Speaker detects the AUX input","zh":"音箱检测到 AUX 输入"},
            "help":{"en":"First select AUX mode on the speaker and confirm the display shows it. Only then connect the cable and play from the source: the sound must come through.",
                    "zh":"先在音箱上选择 AUX 模式，确认屏幕显示已切换。之后再接上音频线并播放音源，声音应正常传出。"}},
           {"id":"audio","code":"AUX-002","label":{"en":"Audio comes out of the speaker","zh":"音箱正常出声"},
            "help":{"en":"Play from the source and confirm sound in both channels. Wiggle the plug gently: the sound must not cut out.",
                    "zh":"从音源播放并确认左右声道都有声音。轻轻晃动插头，声音不应中断。"}},
           {"id":"noise","code":"AUX-003","label":{"en":"No hum or interference","zh":"无杂音或干扰"},
            "help":{"en":"With the cable connected but the source paused, listen close to the grille. There must be no hum or buzz from the cable or the mains.",
                    "zh":"连接音频线但暂停音源，靠近网罩细听。不应有来自线材或电源的嗡嗡声。"}},
           {"id":"continuous","code":"AUX-004","label":{"en":"No dropouts during playback","zh":"播放过程无中断"},
            "help":{"en":"Let one full track play without touching anything. Listen for cuts, stutters or channels dropping out.",
                    "zh":"完整播放一首曲目，中途不做任何操作。注意是否有断音、卡顿或某个声道消失。"}},
           {"section":{"en":"Playback controls","zh":"播放控制"},
            "help":{"en":"With audio playing, press each button on the speaker and confirm it reacts: track, folder, play/pause, repeat, record and mode.",
                    "zh":"在播放状态下逐个按下音箱按键并确认反应：切歌、切文件夹、播放/暂停、循环、录音和模式。"}},
           {"id":"play_pause","code":"AUX-005","label":{"en":"PLAY / PAUSE button","zh":"播放/暂停按键"},
            "help":{"en":"Press it on the speaker. The sound must stop and resume. Mark N/A if this reference does not control the AUX source.",
                    "zh":"在音箱上按下。声音应停止并可恢复。本型号无法控制 AUX 音源时标记为“不适用”。"}},
           {"id":"modes","code":"DSP-005","label":{"en":"Mode button","zh":"模式按键"},
            "help":{"en":"Press the mode button through the full cycle until it returns to AUX. The display must follow every change.",
                    "zh":"反复按模式键走完一轮回到 AUX。显示屏应随每一次切换变化。"}},
           {"section":{"en":"Audio controls","zh":"音频控制"},
            "help":{"en":"Move each control through its full range and check the on-screen indicator follows it.",
                    "zh":"将每个旋钮从最小转到最大，确认屏幕显示同步变化。"}},
           {"id":"volume_max","code":"AUD-006","label":{"en":"Volume to maximum and its on-screen indicator","zh":"音量调到最大及屏幕显示"},
            "help":{"en":"Take the volume from minimum to maximum slowly. The number on the display must follow the whole way, with no jumps, dead spots or scratchy sound.",
                    "zh":"缓慢将音量从最小调到最大。屏幕数值应全程同步变化，不应跳数、无死区、无刮擦杂音。"}},
           {"id":"treble","code":"AUD-007","label":{"en":"Treble level and its on-screen indicator","zh":"高音调节及屏幕显示"},
            "help":{"en":"With music playing, take the treble fully down and fully up. The change must be clearly audible and the indicator must follow it.",
                    "zh":"播放音乐时，将高音从最小调到最大。声音变化应清晰可辨，指示应同步变化。"}},
           {"id":"bass","code":"AUD-008","label":{"en":"Bass level and its on-screen indicator","zh":"低音调节及屏幕显示"},
            "help":{"en":"With music playing, take the bass fully down and fully up. The change must be clearly audible and the indicator must follow it.",
                    "zh":"播放音乐时，将低音从最小调到最大。声音变化应清晰可辨，指示应同步变化。"}},
           {"section":{"en":"Microphones and guitar","zh":"麦克风与吉他"},
            "help":{"en":"Plug a microphone into MIC1 and speak while you adjust volume, echo and priority. Repeat with MIC2, then connect the guitar. Mark N/A for whatever this reference does not have.",
                    "zh":"将麦克风插入 MIC1，一边说话一边调节音量、混响和优先键；MIC2 重复同样操作，最后接上吉他。本型号没有的功能标记为“不适用”。"}},
           {"id":"mic1_priority","code":"MIC-005","label":{"en":"MIC1 priority button","zh":"麦克风 1 优先键"},
            "help":{"en":"With music playing, press priority and speak into MIC1. The music must drop while you speak and come back when you stop.",
                    "zh":"在播放音乐时按下优先键并对麦克风 1 说话。说话时音乐应自动减小，停止后恢复。"}},
           {"id":"mic2_priority","code":"MIC-005","label":{"en":"MIC2 priority button","zh":"麦克风 2 优先键"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"mic1_volume","code":"MIC-006","label":{"en":"MIC1 volume","zh":"麦克风 1 音量"},
            "help":{"en":"Speak continuously into MIC1 while turning its volume from minimum to maximum. The level must rise smoothly, without cutting out or crackling.",
                    "zh":"对麦克风 1 持续说话，同时把音量从最小调到最大。音量应平滑上升，不应中断或有爆音。"}},
           {"id":"mic2_volume","code":"MIC-006","label":{"en":"MIC2 volume","zh":"麦克风 2 音量"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"mic1_echo","code":"MIC-007","label":{"en":"MIC1 echo","zh":"麦克风 1 回声"},
            "help":{"en":"Say short words into MIC1 and turn the echo up. The repetition must become clearly audible, and disappear when turned down.",
                    "zh":"对麦克风 1 说短词并加大回声。重复声应明显可闻，调回最小时应消失。"}},
           {"id":"mic2_echo","code":"MIC-007","label":{"en":"MIC2 echo","zh":"麦克风 2 回声"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"mic1_reverb","code":"MIC-008","label":{"en":"MIC1 reverb","zh":"麦克风 1 混响"},
            "help":{"en":"Speak into MIC1 and raise the reverb. The voice must gain body and depth, not repeat like the echo. Both controls must act independently.",
                    "zh":"对麦克风 1 说话并加大混响。人声应变得更有空间感和厚度，而不是像回声那样重复。两个旋钮应各自独立起作用。"}},
           {"id":"mic2_reverb","code":"MIC-008","label":{"en":"MIC2 reverb","zh":"麦克风 2 混响"},
            "help":{"en":"Same test with MIC2. Mark N/A if this reference has only one microphone input.",
                    "zh":"用麦克风 2 做同样测试。本型号只有一个麦克风接口时标记为“不适用”。"}},
           {"id":"guitar","code":"AUD-009","label":{"en":"Guitar volume","zh":"吉他音量"},
            "help":{"en":"Plug the guitar into its input and play while moving its volume control from minimum to maximum. Mark N/A if this reference has no guitar input.",
                    "zh":"将吉他插入专用接口，一边弹奏一边把吉他音量从最小调到最大。本型号没有吉他接口时标记为“不适用”。"}},
           {"section":{"en":"Lights","zh":"灯光"},
            "help":{"en":"Switch the light on and off, and step through the light modes if the speaker has them.",
                    "zh":"开关灯光，如有多种灯光模式请逐一切换确认。"}},
           {"id":"light","code":"LED-006","label":{"en":"Light on / off","zh":"灯光开关"},
            "help":{"en":"Press the light button several times. It must switch on and off cleanly every time, with no flicker and no LED left lit.",
                    "zh":"多次按下灯光键。每次都应干脆地开和关，不闪烁，也不应有个别灯珠残亮。"}},
           {"id":"light_pattern","code":"LED-007","label":{"en":"Light pattern change","zh":"灯光模式切换"},
            "help":{"en":"Step through every light pattern and back to the first. Each one must be visibly different, with no dead LEDs in any pattern.",
                    "zh":"逐一切换所有灯光模式并回到第一个。每种模式应有明显区别，且任何模式下都不应有不亮的灯珠。"}}]},

        {"id":"REMOTE","optional":true,
         "label":{"en":"REMOTE CONTROL","zh":"遥控器"},
         "steps":[
           {"en":"Check the remote has a battery; remove the insulator if new","zh":"确认遥控器有电池，新品请抽出绝缘片"},
           {"en":"Point at the speaker from about 3 metres","zh":"距离音箱约 3 米对准操作"},
           {"en":"Press each button on the list and confirm on the speaker","zh":"逐个按下列按键，并在音箱上确认反应"},
           {"en":"Repeat some buttons at an angle, not only straight on","zh":"部分按键需侧向角度再测一次，不只正对"}],
         "points":[
           {"section":{"en":"Power and mute","zh":"电源与静音"},
            "help":{"en":"Check the remote has a battery and remove the insulator if new. Point at the speaker from about 3 metres.",
                    "zh":"确认遥控器有电池，新品请抽出绝缘片。距离音箱约 3 米对准操作。"}},
           {"id":"power","code":"RMT-001","label":{"en":"Power on / off","zh":"电源开关"},
            "help":{"en":"Press it to switch the speaker off, then again to switch it on. Both directions must work from 3 metres.",
                    "zh":"按下关闭音箱，再按一次开机。3 米距离下开和关都必须有效。"}},
           {"id":"mute","code":"RMT-002","label":{"en":"MUTE","zh":"静音"},
            "help":{"en":"With music playing, press MUTE: the sound must stop instantly. Press again: it must come back at the same volume.",
                    "zh":"播放音乐时按静音键，声音应立即消失；再按一次应以原音量恢复。"}},
           {"section":{"en":"Source selection","zh":"音源选择"},
            "help":{"en":"Press each source key and confirm the speaker switches to it. Mark N/A for sources this reference does not have.",
                    "zh":"逐个按下音源键，确认音箱切换到对应音源。本型号没有的音源标记为“不适用”。"}},
           {"id":"src_fm","code":"RMT-003","label":{"en":"FM RADIO","zh":"收音"},
            "help":{"en":"Press it from another source. The speaker must switch straight to radio and the display must show it.",
                    "zh":"在其他音源下按此键，音箱应直接切到收音，屏幕应显示。"}},
           {"id":"src_usb","code":"RMT-004","label":{"en":"USB","zh":"USB"},
            "help":{"en":"With the USB drive inserted, press it from another source. The speaker must switch to USB and start playing.",
                    "zh":"插着 U 盘时从其他音源按此键，音箱应切到 USB 并开始播放。"}},
           {"id":"src_bt","code":"RMT-005","label":{"en":"BLUETOOTH","zh":"蓝牙"},
            "help":{"en":"Press it from another source. The speaker must switch to Bluetooth and become discoverable or reconnect to the phone.",
                    "zh":"在其他音源下按此键，音箱应切到蓝牙并可被搜索或自动回连手机。"}},
           {"id":"src_sd","code":"RMT-006","label":{"en":"SD","zh":"SD 卡"},
            "help":{"en":"With the card inserted, press it from another source. Mark N/A if this reference has no SD slot.",
                    "zh":"插着 SD 卡时从其他音源按此键。本型号没有 SD 卡槽时标记为“不适用”。"}},
           {"id":"src_aux","code":"RMT-007","label":{"en":"AUX","zh":"AUX"},
            "help":{"en":"With the AUX cable connected, press it from another source. The speaker must switch to AUX.",
                    "zh":"连接 AUX 音频线后从其他音源按此键，音箱应切到 AUX。"}},
           {"id":"modes","code":"RMT-012","label":{"en":"Mode button","zh":"模式键"},
            "help":{"en":"Press it repeatedly. The speaker must step through every source in order and return to the first.",
                    "zh":"连续按此键，音箱应依次切换所有音源并回到第一个。"}},
           {"section":{"en":"Playback keys","zh":"播放按键"},
            "help":{"en":"With a source playing, press each key and confirm the speaker reacts.",
                    "zh":"在有音源播放时按下每个键，确认音箱有反应。"}},
           {"id":"play_pause","code":"RMT-015","label":{"en":"PLAY / PAUSE","zh":"播放/暂停"},
            "help":{"en":"Press once: the sound must stop. Press again: it must resume from the same point, not from the start.",
                    "zh":"按一次声音应停止；再按一次应从原位置继续，而不是从头播放。"}},
           {"id":"song_next","code":"RMT-013","label":{"en":"Next track","zh":"下一曲"},
            "help":{"en":"Press it three times. The track number must advance one at a time from the remote, just as it does from the panel.",
                    "zh":"连续按三次。曲目编号应逐一递增，与面板操作效果一致。"}},
           {"id":"song_prev","code":"RMT-014","label":{"en":"Previous track","zh":"上一曲"},
            "help":{"en":"Press it three times. The track number must go back one at a time, without jumping or restarting.",
                    "zh":"连续按三次。曲目编号应逐一递减，不应跳号或重头开始。"}},
           {"id":"fast_fwd","code":"RMT-018","label":{"en":"Fast forward","zh":"快进"},
            "help":{"en":"Hold it down during a track. The music must move forward while held and carry on normally when released.",
                    "zh":"播放中长按此键。按住时音乐应快速前进，松开后正常继续播放。"}},
           {"id":"rewind","code":"RMT-019","label":{"en":"Rewind","zh":"快退"},
            "help":{"en":"Hold it down during a track. The music must move backward while held and carry on normally when released.",
                    "zh":"播放中长按此键。按住时音乐应快速后退，松开后正常继续播放。"}},
           {"id":"repeat","code":"RMT-024","label":{"en":"Repeat track","zh":"循环播放"},
            "help":{"en":"Press it and check the repeat icon changes on the display, then let a track end to confirm the mode really applies.",
                    "zh":"按下后确认屏幕循环图标变化，再让曲目播完，确认循环模式确实生效。"}},
           {"id":"folder_next","code":"RMT-021","label":{"en":"Folder forward","zh":"下一文件夹"},
            "help":{"en":"Press it and confirm the folder number changes and playback jumps to another folder.",
                    "zh":"按下后确认文件夹编号变化，并跳到另一个文件夹播放。"}},
           {"id":"folder_prev","code":"RMT-022","label":{"en":"Folder back","zh":"上一文件夹"},
            "help":{"en":"Press it and confirm it returns to the previous folder.",
                    "zh":"按下后确认返回上一个文件夹。"}},
           {"id":"keypad","code":"RMT-020","label":{"en":"Numeric keypad","zh":"数字键盘"},
            "help":{"en":"Type a track number, for example 005. The speaker must jump straight to that track. Test every digit from 0 to 9, not just one.",
                    "zh":"输入曲目编号，例如 005，音箱应直接跳到该曲。0 到 9 每个数字键都要测，不能只测一个。"}},
           {"section":{"en":"Volume and audio","zh":"音量与音效"},
            "help":{"en":"Hold VOL + and VOL − and confirm the level moves on the display. Press EQ and check the preset changes.",
                    "zh":"长按音量加/减键，确认屏幕音量数值变化。按 EQ 键确认音效模式切换。"}},
           {"id":"vol_up","code":"RMT-016","label":{"en":"VOL +","zh":"音量 +"},
            "help":{"en":"Press it several times and hold it once. The level must rise step by step on the display and the sound must follow.",
                    "zh":"连按几次并长按一次。屏幕音量应逐级上升，声音应随之变大。"}},
           {"id":"vol_down","code":"RMT-017","label":{"en":"VOL −","zh":"音量 −"},
            "help":{"en":"Press it several times and hold it once. The level must fall step by step, all the way down to zero.",
                    "zh":"连按几次并长按一次。音量应逐级下降，直到降为零。"}},
           {"id":"eq","code":"RMT-023","label":{"en":"EQ button","zh":"EQ 键"},
            "help":{"en":"Press it through every preset. The display must show the name change and the sound must be audibly different between presets.",
                    "zh":"逐一切换所有音效预设。屏幕应显示名称变化，且不同预设之间声音应有明显差异。"}},
           {"section":{"en":"Microphone and recording","zh":"麦克风与录音"},
            "help":{"en":"Record a few seconds with REC, play it back with REC PLAY. Retest some keys at an angle, not only straight on.",
                    "zh":"用 REC 键录几秒，再用 REC PLAY 播放。部分按键需侧向角度再测一次，不只正对。"}},
           {"id":"mic_priority","code":"RMT-008","label":{"en":"Microphone priority","zh":"麦克风优先"},
            "help":{"en":"With music playing, press it and speak into the microphone. The music must drop while you speak and return afterwards.",
                    "zh":"播放音乐时按下此键并对麦克风说话。说话时音乐应减小，停止后恢复。"}},
           {"id":"rec","code":"RMT-009","label":{"en":"REC — record","zh":"REC — 录音"},
            "help":{"en":"Press REC and speak for a few seconds. The display must show it is recording, and pressing it again must stop the recording.",
                    "zh":"按 REC 并说话几秒。屏幕应显示正在录音，再按一次应停止录音。"}},
           {"id":"rec_play","code":"RMT-010","label":{"en":"REC PLAY — play the recording","zh":"REC PLAY — 播放录音"},
            "help":{"en":"Press it and confirm the recording you just made plays back clearly through the speaker.",
                    "zh":"按下后确认刚才的录音能通过音箱清晰回放。"}},
           {"id":"voice_out","code":"RMT-011","label":{"en":"VOICE OUT","zh":"VOICE OUT"},
            "help":{"en":"Press it while speaking into the microphone and listen for the change in the voice effect. Mark N/A if this reference has no VOICE OUT.",
                    "zh":"对麦克风说话时按下此键，注意人声效果的变化。本型号没有 VOICE OUT 时标记为“不适用”。"}}]},

        {"id":"EXTERNAL","optional":false,"type":"photos","no_na":true,
         "label":{"en":"EXTERNAL PARTS","zh":"外观部件"},
         "steps":[
           {"en":"Place the speaker in good light, avoiding direct reflections","zh":"将音箱置于光线充足处，避免反光"},
           {"en":"Photograph each area on the list, looking for scratches, dents, stains or paint defects","zh":"逐项拍摄，检查刮痕、凹陷、污渍或喷涂缺陷"},
           {"en":"Check the alignment of parts, joints and visible screws","zh":"检查部件对位、接缝和外露螺丝"},
           {"en":"Confirm logos and labels are straight, complete and legible","zh":"确认标志和标签端正、完整、清晰"},
           {"en":"If you find a defect, take a close-up as well as the general photo","zh":"发现缺陷时，除整体照外再拍一张特写"},
