  align-content:space-around;justify-content:space-around;opacity:.055}
.wm-rows span{white-space:nowrap;padding:16px 30px;font-size:12pt;
  font-weight:700;letter-spacing:3.5px;color:#0f3f6b;text-transform:uppercase}
/* Two selectors on purpose: in the exported file the report is made of body
   children, while the in-app preview nests the same markup inside #report. */
body > *:not(.wm), #report > *:not(.wm){position:relative;z-index:1}

@media print{
  body{padding:0;max-width:none;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bnr{position:running(top)}
  .sec,.find,.cell{page-break-inside:avoid}
  .brk{page-break-before:always}
}
</style></head><body>
${watermark()}
${banner}

<div class="sec"><i>I</i><b>${tr("general_info")}</b></div>
<table>
  <tr><td class="k">${tr("test_id")}</td><td class="v">${esc(S.testId)}</td>
      <td class="k">${tr("inspection")}</td><td class="v">${esc(inspectionDate(S.startedAt))}</td></tr>
  <tr><td class="k">${tr("reference")}</td><td class="v">${esc(S.model)}</td>
      <td class="k">${tr("po")}</td><td class="v">${esc(S.po||"—")}</td></tr>
  <tr><td class="k">${tr("operator")}</td><td class="v">${esc(S.operator)}</td>
      <td class="k">${tr("plan")}</td><td class="v">v${plan().plan_version} · HOKLAN QC ${APP_VERSION}</td></tr>
  <tr><td class="k">${tr("units_report")}</td><td class="v">${S.units}</td>
      <td class="k">${tr("by_unit")}</td><td class="v">${allUnits().map(i=>{
        const uv = unitVerdict(unitRows(i));
        return `<span class="${uv==="PASS"?"p":uv==="FAIL"?"f":"na"}">${
          fmt("speaker_n",{n:i+1})}: ${verdictText(uv)}</span>`;
      }).join(" &nbsp;|&nbsp; ")}</td></tr>
  <tr><td class="k">${tr("scope")}</td><td class="v" colspan="3">${
    scope ? `<b class="f">${fmt("scope_part",{n:scope.n, tot:scope.tot})}</b>`
          : tr("scope_full")}</td></tr>
  <tr><td class="k">${tr("origin")}</td><td class="v" colspan="3">${
    S.selfCheck ? `<b class="f">${tr("origin_factory")}</b>`
                : tr("origin_hoklan")}</td></tr>
</table>
${scope?`<p class="att">${tr("scope_part_note")}</p>`:""}
${S.selfCheck?`<p class="att">${tr("origin_note")}</p>`:""}

<div class="sec"><i>II</i><b>${tr("inspection_summary")}</b></div>
<table>
  <tr><th>${tr("th_test")}</th><th class="c" style="width:60px">${tr("ok")}</th>
      <th class="c" style="width:60px">${tr("fail")}</th>
      <th class="c" style="width:60px">N/A</th>
      <th class="c" style="width:70px">${tr("th_result")}</th>
      <th style="width:110px">${tr("th_remark")}</th></tr>`;

  let rIndex = 0;
  allUnits().forEach(u => {
  // With several speakers the summary stays one table, split by a banner row.
  // Separate tables would break the column alignment the reader compares down.
  if(S.units > 1){
    const uv = unitVerdict(unitRows(u));
    h += `<tr><td colspan="5" style="background:#eef2f6;font-weight:700">
      ${fmt("speaker_n",{n:u+1})}</td>
      <td style="background:#eef2f6" class="${
        uv==="PASS"?"p":uv==="FAIL"?"f":"na"}">${verdictText(uv)}</td></tr>`;
  }
  unitRows(u).forEach((r,i)=>{
    if(!r) return;
    const t = tests()[i];
    if(t.type === "photos" && u > 0) return;   // documented once for the lot
    const defs = realPoints(t);
    let ok = 0, bad = 0, na = 0, refs = [];

    if(r.verdict === "DOC"){
      ok = defs.filter(p => shotsFor(r,p.id).length).length;
      na = defs.filter(p => r.points[p.id] === "NA").length;
    } else {
      defs.forEach(p => {
        const val = r.points[p.id];
        if(val === "PASS") ok++;
        else if(val === "FAIL"){
          bad++;
          // Only a test that was closed as FAIL produces findings in III, so
          // only those advance the R counter — otherwise this column cites an
          // R number that section III never prints.
          if(r.verdict === "FAIL"){ rIndex++; refs.push("R"+rIndex); }
        }
        else if(val === "NA") na++;
      });
    }

    const label = r.verdict === "DOC" ? tr("documented")
                : r.verdict === "PASS" ? tr("ok")
                : r.verdict === "FAIL" ? tr("fail") : (r.verdict || tr("pending"));
    const cls = r.verdict === "FAIL" ? "f" : r.verdict === "PASS" ? "p" : "na";

    h += `<tr><td>${esc(L(t.label))}</td>
      <td class="c">${ok||"—"}</td><td class="c ${bad?"f":""}">${bad||"—"}</td>
      <td class="c">${na||"—"}</td>
      <td class="c ${cls}">${label}</td>
      <td style="color:#e8720c">${refs.join(" ")}</td></tr>`;
  });
  });
  h += `</table>`;

  /* ---- III REMARKS ---- */
  if(findings.length){
    h += `<div class="sec"><i>III</i><b>${tr("remarks")}</b></div>
      <p class="note">${tr("remarks_note")}</p>`;
    findings.forEach((f,k)=>{
      h += `<div class="find">
        <div class="find-h"><i>R${k+1}</i>
          <span>${S.units>1?`<b style="color:#0f3f6b">${
            fmt("speaker_n",{n:f.unit+1})}</b> · `:""}<b>${esc(f.test)}</b> — ${esc(f.point)}</span>
          <em>${esc(f.code)}</em></div>
        <div class="find-b">
          <div>${esc(f.desc)}</div>
          ${f.note?`<div class="note"><b>${tr("notes")}:</b> ${esc(f.note)}${
            f.noteEn && f.noteEn !== f.note
              ? `<span class="en"><b>${trLabel()}:</b> ${esc(f.noteEn)}</span>`
              : ""}</div>`:""}
          ${f.videos && f.videos.length?`<div class="att">🎥 <b>${
            fmt("video_att",{n:f.videos.length})}</b><br>${
            f.videos.map(m => esc(videoFiles[m.uid] || m.name || "video"))
              .join("<br>")}</div>`:""}
          ${f.media.length?`<div class="grid" style="margin-top:6px">${
            f.media.map(s=>{ shot++; return `<div class="cell">
              <div class="ph"><img src="${s.url}">
                <span class="ts">${shotStamp(s.at)}</span></div>
              <div class="cap">#${shot} R${k+1}</div></div>`; }).join("")}</div>`:""}
        </div></div>`;
    });
  }

  /* ---- IV EVIDENCE ----
     General evidence, the notes and the videos of each test. The pictures of a
     specific defect were already printed with their finding in III, and
     printing them twice makes the report look padded and the numbering harder
     to follow — so the same rule applies to a video already named up there. */
  const general = r => (r.media || []).filter(m => m.kind === "photo" && !m.slot);
  const shownVideos = {};
  findings.forEach(f => (f.videos || []).forEach(m => { shownVideos[m.uid] = true; }));

  /* One block per test rather than per speaker. General evidence, the notes and
     the videos all document the test itself, not any one unit — they live on
     speaker 1 because they have to live somewhere — so there is no SPEAKER
     banner here: it would claim the bench photo shows unit 1 in particular.
     Videos are the exception: one attached to a defect on speaker 3 is filed
     against speaker 3, so they are collected across every unit and each says
     which point and which speaker it belongs to. */
  const blocksIV = tests().map((t,i) => {
    const r0 = unitRows(0)[i];
    const isDoc = t.type === "photos";
    const photos = !r0 ? []
      : isDoc ? r0.media.filter(m => m.kind === "photo") : general(r0);
    const videos = [];
    allUnits().forEach(u => {
      const r = unitRows(u)[i];
      if(!r) return;
      (r.media || []).forEach(m => {
        if(m.kind === "video" && !shownVideos[m.uid]) videos.push({m, u});
      });
    });
    const note = ((r0 && r0.comment) || "").trim();
    const noteEn = r0 ? String(trOf(r0, "comment") || "").trim() : "";
    return {t, r0, isDoc, photos, videos, note, noteEn};
  }).filter(b => b.photos.length || b.videos.length || b.note);

  if(blocksIV.length){
    h += `<div class="sec brk"><i>IV</i><b>${tr("evidence_sec")}</b></div>`;
    blocksIV.forEach(b => {
      h += `<div class="sec" style="background:#f7f9fb"><i>&nbsp;</i><b>${
        esc(L(b.t.label))}</b></div>`;

      if(b.note)
        h += `<p class="note"><b>${tr("notes")}:</b> ${esc(b.note)}${
          b.noteEn && b.noteEn !== b.note
            ? `<span class="en"><b>${trLabel()}:</b> ${esc(b.noteEn)}</span>`
            : ""}</p>`;

      if(b.videos.length)
        h += `<div class="att">🎥 <b>${fmt("video_att",{n:b.videos.length})}</b><br>${
          b.videos.map(v => {
            const p = v.m.slot ? realPoints(b.t).find(x => x.id === v.m.slot) : null;
            return esc([videoFiles[v.m.uid] || v.m.name || "video",
                        p ? L(p.label) : "",
                        S.units > 1 && !b.isDoc ? fmt("speaker_n",{n:v.u+1}) : ""]
                       .filter(Boolean).join("  ·  "));
          }).join("<br>")}</div>`;

      if(b.photos.length){
        h += `<div class="grid">`;
        if(b.isDoc){
          realPoints(b.t).forEach(p => {
            shotsFor(b.r0, p.id).forEach(s => {
              shot++;
              h += `<div class="cell"><div class="ph"><img src="${s.url}">
                <span class="ts">${shotStamp(s.at)}</span></div>
                <div class="cap">#${shot} ${esc(L(p.label))}</div></div>`;
            });
          });
        } else {
          const bad = b.r0 && b.r0.verdict === "FAIL";
          b.photos.forEach(s => {
            shot++;
            h += `<div class="cell"><div class="ph"><img src="${s.url}">
              <span class="ts">${shotStamp(s.at)}</span></div>
              <div class="cap">#${shot} ${esc(L(b.t.label))} | <span class="${
                bad?"f":"p"}">${bad?tr("fail"):tr("ok")}</span></div></div>`;
          });
        }
        h += `</div>`;
      }
    });
  }

  /* Videos cannot be embedded in a printable report, so they are listed. This
     runs over every speaker independently of section IV: a video attached to a
     defect on speaker 3 has no general photo next to it and would otherwise
     never be mentioned anywhere. */
  const vids = [];
  allUnits().forEach(u => unitRows(u).forEach(r => {
    if(!r) return;
    (r.media || []).forEach(m => { if(m.kind === "video") vids.push(m); });
  }));
  if(vids.length) h += `<p class="note">${fmt("videos_n",{n:vids.length})}</p>`;

  /* ---- V CONCLUSION ---- */
  h += `<div class="sec"><i>V</i><b>${tr("conclusion")}</b></div>
    ${S.units>1?`<table style="margin-bottom:10px">
      <tr><th>${tr("speaker")}</th><th class="c" style="width:90px">${tr("th_result")}</th>
        <th style="width:180px">${tr("failures")}</th></tr>
      ${allUnits().map(i=>{
        const uv = unitVerdict(unitRows(i));
        const cs = unitRows(i).filter(r=>r&&r.verdict==="FAIL")
          .reduce((a,r)=>a.concat((r.failedPoints||[]).map(p=>p.code)),[]);
        return `<tr><td>${fmt("speaker_n",{n:i+1})}</td>
          <td class="c ${uv==="PASS"?"p":uv==="FAIL"?"f":"na"}">${verdictText(uv)}</td>
          <td>${esc(cs.join(", ")) || "—"}</td></tr>`;
      }).join("")}
    </table>`:""}
    <div class="concl">
      <b>${verdictText(v)}</b>
      <span>${tr("operator")}: ${esc(S.operator)} · ${esc(inspectionDate(S.startedAt))}</span>
      ${findings.length?`<div class="note" style="margin-top:10px">
        ${fmt("concl_fail",{n:findings.length})}</div>`:
        `<div class="note" style="margin-top:10px">${tr("concl_pass")}</div>`}
      ${scope?`<div class="note" style="margin-top:8px"><b>${
        fmt("scope_part",{n:scope.n, tot:scope.tot})}</b></div>`:""}
    </div>
    <p class="note">${tr("footer_note")}</p>`;

  return h + `</body></html>`;
}

/* The report is drawn at once from what is already translated, then redrawn if
   a pending translation lands: waiting on the network before showing anything
   would leave the operator looking at a blank screen on a bad connection. */
function showReport(){
  S.screen = "report";
  render();
  ensureTranslations().then(() => { if(S.screen === "report") render(); });
}

/* PDF in one tap, from the finish screen. No browser can write a PDF file on
   its own — what exists is the print dialog with "Save as PDF" as the
   destination — so this opens the report and calls it straight away instead of
   making the operator find it. The English lines are filled in first: printing
   a report and then translating it would issue the wrong document. */
async function savePdfNow(){
  showSaved(tr("pdf_wait"));
  try{ await ensureTranslations(); }catch(e){}
  showSaved("");
  S.screen = "report";
  render();
  window.scrollTo(0,0);
  // The report is hundreds of images; give the browser a frame to lay them out
  // before the print dialog freezes the page, or the first pages come out blank.
  setTimeout(() => { if(S.screen === "report") printReport(); }, 600);
}

/* The PDF has to arrive with the same name as the ZIP, so that a report sent on
   its own and the full packet of the same inspection sit next to each other in
   a folder instead of looking like two unrelated files.

   Browsers take the suggested PDF file name from the document title — there is
   no API for it — so the title is swapped for the packet name, the dialog is
   opened, and the title is put back. It is restored on `afterprint`, plus a
   timeout: that event never fires in some mobile browsers, and leaving the tab
   titled with the packet name would also rename the home-screen shortcut. */
function printReport(){
  const prev = document.title;
  let restored = false;
  const restore = () => {
    if(restored) return;
    restored = true;
    document.title = prev;
  };
  document.title = packetName();
  window.addEventListener("afterprint", restore, {once:true});
  setTimeout(restore, 120000);
  try{ window.print(); }
  finally{
    // On desktop print() blocks until the dialog closes, so by here the name has
    // already been used and the title can go back immediately. On mobile it
    // returns at once and `afterprint` does the job instead.
    setTimeout(restore, 1500);
  }
}

/* ---------- spreadsheet export --------------------------------------------
   One row per checked point, not one per test. That is what lets Quality
   pivot the data later - "which USB defect is most common across YIS?" - which
   a one-row-per-inspection sheet can never answer.

   CSV with a UTF-8 BOM: Excel needs the BOM or every Chinese character opens
   as mojibake, and CSV avoids the "file format does not match extension"
   warning that a fake .xls throws in current Excel.
--------------------------------------------------------------------------- */
function csvCell(v){
  const s = String(v === null || v === undefined ? "" : v);
  return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function reportCsv(){
  /* Two kinds of column on purpose:
     · *_key  — language-independent identifiers. Group and filter on these,
                otherwise an English CSV and a Chinese one split the same test
                into two rows in the dashboard.
     · label  — human text in whatever language the operator used, for reading. */
  /* `Speaker` and `Speaker result` come before the point columns so the sheet
     can be filtered or pivoted by unit: with 5 speakers the same point_key
     appears 5 times, and without this column they would be indistinguishable
     and would collapse into one another in the dashboard. */
  const head = LANG === "zh"
    ? ["测试编号","型号","订单号","检验员","检验日期","最终结果","检验范围","来源",
       "音箱","音箱数量","音箱结果",
       "test_key","point_key","result_key",
       "测试","分组","检查项","结果","代码","代码说明","备注","备注（翻译）","照片数"]
    : LANG === "es"
    ? ["Código de prueba","Referencia","OC","Inspector","Fecha","Resultado final",
       "Alcance","Origen","Parlante","Parlantes","Resultado del parlante",
       "test_key","point_key","result_key",
       "Prueba","Sección","Punto","Resultado","Código","Descripción del código",
       "Observaciones","Observaciones (traducción)","Fotos"]
    : ["Test ID","Reference","PO","Operator","Inspection","Final result","Scope",
       "Origin","Speaker","Speakers","Speaker result",
       "test_key","point_key","result_key",
       "Test","Section","Point","Result","Code","Code description",
       "Notes","Notes (translated)","Photos"];

  // The scope travels on every row: a dashboard that groups by test_key has to
  // be able to exclude partial inspections, and it can only do that if the
  // column is on the row it is reading.
  const sc = partialScope();
  const base = [S.testId, S.model, S.po, S.operator,
                inspectionDate(S.startedAt), finalVerdict(),
                sc ? fmt("scope_part",{n:sc.n, tot:sc.tot}) : tr("scope_full"),
                S.selfCheck ? tr("origin_factory") : tr("origin_hoklan")];
  const rows = [head];

  allUnits().forEach(u => {
  const lead = base.concat([u + 1, S.units, unitVerdict(unitRows(u))]);
  unitRows(u).forEach((r,i)=>{
    if(!r) return;
    const t = tests()[i];
    // Photo tests document the shipment, not each speaker: the pictures live
    // on speaker 1 only, so emitting them again for 2..N would write rows that
    // look pending when the documentation is in fact complete.
    if(t.type === "photos" && u > 0) return;
    let section = "";

    pointsOf(t).forEach(p => {
      if(p.section){ section = L(p.section); return; }

      let key, result, code = "", desc = "", photos = shotsFor(r, p.id).length;
      let note = ((r.notes && r.notes[p.id]) || "").trim();
      if(t.type === "photos"){
        key = r.points[p.id] === "NA" ? "NA" : photos ? "DOC" : "PENDING";
        result = key === "NA" ? "N/A"
               : key === "DOC" ? tr("documented") : tr("pending");
      } else {
        const v = r.points[p.id];
        key = v || "PENDING";
        result = v === "PASS" ? tr("ok") : v === "FAIL" ? tr("fail")
               : v === "NA" ? "N/A" : tr("pending");
        if(v === "FAIL"){ code = p.code || ""; desc = codeText(p.code); }
        // A failed point carries its own count and its own note; anything else
        // reports the test-level evidence.
        if(v !== "FAIL"){ photos = r.media.filter(m => !m.slot).length; note = ""; }
      }

      // Both columns describe the same note: the original as the inspector
      // wrote it, and its English line. Whichever note is printed, its own
      // translation goes next to it — never the other one's.
      const shownNote = note || r.comment || "";
      const shownEn = note ? trOf(r, "note", p.id) : trOf(r, "comment");

      rows.push(lead.concat([
        t.id, p.id, key,
        L(t.label), section, L(p.label), result, code, desc,
        shownNote, shownEn || "", photos
      ]));
    });
  });
  });

  return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}

/* ---------- the packet ----------------------------------------------------
   Everything the inspection produced travels as one file: the report, the
   spreadsheet and the videos. Sending three separate attachments over WeChat
   is how one of them gets lost.

   The ZIP is written by hand, stored (no compression). Photos and videos are
   already compressed formats, so deflating them would cost seconds of phone
   CPU to save almost nothing; and writing "stored" needs no library, which is
   what keeps this app a single offline file.
--------------------------------------------------------------------------- */
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function makeZip(entries){
  const enc = new TextEncoder();
  const now = new Date();
  const time = ((now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1)) & 0xFFFF;
  const date = (((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate()) & 0xFFFF;

  const parts = [], dir = [];
  let offset = 0;

  for(const e of entries){
    const blob = e.data instanceof Blob ? e.data : new Blob([e.data]);
    // Read one file at a time and push the Blob, not the bytes: the browser can
    // spill Blobs to disk, so a 200 MB video never sits in memory as an array.
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const name = enc.encode(e.name);
    const crc = crc32(bytes), size = bytes.length;

    const lfh = new Uint8Array(30 + name.length);
    const h = new DataView(lfh.buffer);
    h.setUint32(0, 0x04034b50, true);
    h.setUint16(4, 20, true);
    h.setUint16(6, 0x0800, true);      // names are UTF-8
    h.setUint16(8, 0, true);           // stored
    h.setUint16(10, time, true);
    h.setUint16(12, date, true);
    h.setUint32(14, crc, true);
    h.setUint32(18, size, true);
    h.setUint32(22, size, true);
    h.setUint16(26, name.length, true);
    lfh.set(name, 30);

    parts.push(lfh, blob);
    dir.push({name, crc, size, offset});
    offset += lfh.length + size;
  }

  const cd = [];
  let dirSize = 0;
  for(const e of dir){
    const rec = new Uint8Array(46 + e.name.length);
    const h = new DataView(rec.buffer);
    h.setUint32(0, 0x02014b50, true);
    h.setUint16(4, 20, true);
    h.setUint16(6, 20, true);
    h.setUint16(8, 0x0800, true);
    h.setUint16(10, 0, true);
    h.setUint16(12, time, true);
    h.setUint16(14, date, true);
    h.setUint32(16, e.crc, true);
    h.setUint32(20, e.size, true);
    h.setUint32(24, e.size, true);
    h.setUint16(28, e.name.length, true);
    h.setUint32(42, e.offset, true);
    rec.set(e.name, 46);
    cd.push(rec); dirSize += rec.length;
  }

  const eocd = new Uint8Array(22);
  const h = new DataView(eocd.buffer);
  h.setUint32(0, 0x06054b50, true);
  h.setUint16(8, dir.length, true);
  h.setUint16(10, dir.length, true);
  h.setUint32(12, dirSize, true);
  h.setUint32(16, offset, true);

  return new Blob(parts.concat(cd, [eocd]), {type:"application/zip"});
}

/* Every photo and video with the context it was taken in, so the file name can
   say what it shows without anyone having to open it. */
function mediaList(){
  const out = [];
  allUnits().forEach(u => unitRows(u).forEach((r,i)=>{
    if(!r) return;
    const t = tests()[i];
    (r.media || []).forEach(m => {
      const p = m.slot && t ? realPoints(t).find(x => x.id === m.slot) : null;
      out.push({
        m, unit:u,
        test: t ? t.id : (r.id || "TEST"),
        point: p ? p.id : "",
        verdict: p ? (r.points[p.id] || "") : "",
        // Photo tests document the shipment, not one unit: their pictures are
        // filed on speaker 1 for storage reasons only, so the file name must
        // not claim they show speaker 1 in particular.
        lot: !!(t && t.type === "photos")
      });
    });
  }));
  return out;
}
/* Naming rule, as agreed with quality:
     evidence of a point   TEST_point_FAIL_speaker2_01.jpg
     evidence of the test  TEST_01.jpg
   The point-level file carries its verdict because that is the one somebody
   goes looking for months later; the test-level one documents the whole test
   and needs nothing more than the test name. */
function mediaName(v, n){
  const slug = s => String(s||"").replace(/[^A-Za-z0-9]+/g,"_")
                                 .replace(/^_+|_+$/g,"").toUpperCase();
  const bits = [slug(v.test)];
  if(v.point){
    bits.push(slug(v.point));
    if(v.verdict === "PASS" || v.verdict === "FAIL") bits.push(v.verdict);
    if(S.units > 1 && !v.lot) bits.push("speaker" + (v.unit + 1));
  }
  bits.push(String(n).padStart(2,"0"));
  return bits.join("_");
}

function dataUrlToBlob(url){
  const cut = url.indexOf(",");
  const type = (url.slice(0, cut).match(/data:([^;]+)/) || [,"image/jpeg"])[1];
  const bin = atob(url.slice(cut + 1));
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], {type});
}

function packetName(){
  return fileName().replace(/\.html$/, "");
}

/* Run something with the report language forced, then put it back. The whole
   report is built from tr()/L(), so this is all it takes to issue it twice. */
function inLang(code, fn){
  const prev = LANG;
  LANG = code;
  try{ return fn(); }
  finally{ LANG = prev; }
}

async function buildPacket(){
  const base = packetName();

  let lost = 0, photos = 0, videos = 0;
  const files = [];
  const seen = {};   // same name twice would silently overwrite in some tools

  mediaList().forEach(v => {
    const isVideo = v.m.kind === "video";
    let stem = mediaName(v, 1), n = 1;
    while(seen[stem]) stem = mediaName(v, ++n);
    seen[stem] = true;

    if(isVideo){
      // A video only survives while the page is open: what is stored is an
      // object URL, and reloading the page invalidates it. Tested with
      // `instanceof Blob`, not for truthiness — JSON.stringify turns a File
      // into `{}`, which is truthy, and a restored draft would then pack a
      // 15-byte file containing "[object Object]" and report nothing lost.
      if(!(v.m.file instanceof Blob)){ lost++; return; }
      const ext = (v.m.name && v.m.name.indexOf(".") >= 0)
        ? v.m.name.split(".").pop().toLowerCase().slice(0,4) : "mp4";
      files.push({name: `${base}/videos/${stem}.${ext}`, data: v.m.file});
      videos++;
    } else {
      // Photos also travel as files, not only embedded in the report: named
      // this way they can be browsed, forwarded or attached to a claim
      // without opening anything.
      //
      // Guarded one by one. A single unreadable photo used to abort the whole
      // packet from inside atob(); losing one picture and saying so is a far
      // better outcome than losing the videos and the report with it.
      try{
        if(!v.m.url || v.m.url.indexOf("data:") !== 0) throw new Error("no data");
        files.push({name: `${base}/photos/${stem}.jpg`,
                    data: dataUrlToBlob(v.m.url)});
        photos++;
      }catch(err){ lost++; }
    }
  });

  // Both languages, always. The factory fills the checklist in Chinese and the
  // office in Colombia reads English; issuing only the operator's language
  // means somebody has to translate a quality record by hand.
  const entries = [
    {name: base + "/REPORT_ES.html",
     data: new Blob([inLang("es", reportHtml)], {type:"text/html;charset=utf-8"})},
    {name: base + "/REPORT_EN.html",
     data: new Blob([inLang("en", reportHtml)], {type:"text/html;charset=utf-8"})},
    {name: base + "/REPORT_ZH.html",
     data: new Blob([inLang("zh", reportHtml)], {type:"text/html;charset=utf-8"})},
    // The spreadsheet carries the full packet name, not "DATA": it is the file
    // that gets pulled out of the folder and opened on its own, and a Downloads
    // folder with four files called DATA.csv identifies nothing.
    {name: base + "/" + base + ".csv",
     data: new Blob([reportCsv()], {type:"text/csv;charset=utf-8"})},
    {name: base + "/READ_ME.txt",
     data: new Blob([packetReadme(photos, videos, lost)],
                    {type:"text/plain;charset=utf-8"})}
  ].concat(files);

  return {blob: await makeZip(entries), name: base + ".zip",
          videos, photos, lost};
}

function packetReadme(photos, videos, lost){
  const out = [];   // not `L`: that is the localisation helper
  out.push("HOKLAN QC — " + S.testId + " — " + S.model);
  out.push(inspectionDate(S.startedAt) + "  ·  " + S.operator);
  out.push(S.units > 1 ? S.units + " speakers" : "1 speaker");
  const sc = partialScope();
  if(sc) out.push("!! " + fmt("scope_part",{n:sc.n, tot:sc.tot}));
  out.push("");
  out.push("REPORT_ES.html  " + tr("rm_report_es"));
  out.push("REPORT_EN.html  " + tr("rm_report_en"));
  out.push("REPORT_ZH.html  " + tr("rm_report_zh"));
  out.push(packetName() + ".csv");
  out.push("                " + tr("rm_csv"));
  if(photos) out.push("photos/         " + fmt("rm_photos",{n:photos}));
  if(videos) out.push("videos/         " + fmt("rm_videos",{n:videos}));
  out.push("");
  out.push(tr("rm_naming"));
  if(lost){ out.push(""); out.push("!! " + fmt("rm_lost",{n:lost})); }
  out.push("");
  out.push(tr("rm_pdf"));
  // BOM: Notepad on Windows shows the Chinese and the em-dashes as mojibake
  // without it.
  return "﻿" + out.join("\r\n") + "\r\n";
}

function saveBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 20000);
}

function showSaved(html){
  const el = document.getElementById("saved");
  if(!el) return;
  // An empty string hides the box: otherwise cancelling the share dialog left
  // a blank green bar sitting on the screen.
  el.innerHTML = html || "";
  el.classList.toggle("hidden", !html);
}

let packing = false;
async function withPacket(use){
  if(packing) return;
  packing = true;
  const btns = Array.prototype.slice.call(actions.querySelectorAll("button"));
  btns.forEach(b => b.disabled = true);
  showSaved(tr("packing"));
  try{
    // Last chance to fill in any English line the debounce did not catch: after
    // this the report is written and the ZIP is closed.
    await ensureTranslations();
    const p = await buildPacket();
    await use(p);
  }catch(err){
    showSaved(tr("a_pack_fail") + " " + esc(err && err.message ? err.message : err));
  }finally{
    packing = false;
    btns.forEach(b => b.disabled = false);
  }
}

function packetSummary(p){
  return fmt("packet_done",{f:esc(p.name), s:humanSize(p.blob.size),
                            n:p.photos, v:p.videos}) +
         (p.lost ? " " + fmt("rm_lost",{n:p.lost}) : "");
}

function downloadPacket(){
  if(!CAN_DOWNLOAD){ alert(tr("a_no_download")); return; }
  withPacket(async p => {
    saveBlob(p.blob, p.name);
    showSaved(packetSummary(p) + tr("saved_hint"));
    clearDraft();
  });
}

/* There is no SHARE button: the packet is downloaded and attached by hand. The
   system share sheet was removed on request — on iOS that made the download the
   only route off the phone, which is why CAN_DOWNLOAD no longer excludes it. */

/* ---------- screens ------------------------------------------------------- */
function render(){
  if(S.screen === "setup")  renderSetup();
  else if(S.screen === "admin")     renderAdmin();
  else if(S.screen === "adminPick") renderAdminPick();
  else if(S.screen === "test")   renderTest();
  else if(S.screen === "index")  renderIndex();
  else if(S.screen === "report") renderReport();
  else renderDone();
  if(typeof updateTopBtn === "function") updateTopBtn();
}

/* ---------- admin ---------------------------------------------------------
   A second tab where the whole reference catalogue is listed and a single test
   can be launched on its own — a re-test of one defect without walking the
   entire plan again.

   The way in is the Test ID field on the start screen: typing the admin code
   there opens this tab instead of starting an inspection. There is no extra
   box on the screen, and the app looks untouched until somebody knows the code.

   What that is worth: the code sits in a file anyone can read, next to the
   catalogue it guards. It stops an operator from wandering in; it stops nobody
   who opens the page source. Actually restricting Admin would need a server.
--------------------------------------------------------------------------- */
const ADMIN_ID = {digits:"365", code:"365-H8Q2K7L4"};

/* Factory accounts. Same door as the admin code, less behind it: each one only
   ever sees the references of its own factory, so a supplier cannot browse what
   another one makes or read another one's test ID. They exist so a factory can
   run one or two tests on the unit in front of it, which is a different act from
   a HOKLAN inspection — and the report says so.
   Not in CONFIG.test_ids: these are not factories to inspect, they are ways in,
   and a code here must never appear in a report as the inspection's test ID. */
const FACTORY_ADMINS = {
  "711": {code:"711-K4M8P2R6T", key:"YIS"},
  "722": {code:"722-B7N3V9X5D", key:"RHY"},
  "733": {code:"733-J2Q6L8W4Z", key:"EAG"}
};

let ADMIN_OK = false;      // per session on purpose: never remembered on disk
/* "" while the full admin code is in use; the factory key for a factory
   account. Deliberately not cleared when Admin is left: once the phone has been
   handed to a factory in this session, it keeps the narrower permissions until
   the page is reloaded. */
let ADMIN_FACTORY = "";
const isFactoryUser = () => !!ADMIN_FACTORY;

const inAdmin = () => S.screen === "admin" || S.screen === "adminPick";

/* Inside Admin only. The start screen has to be the same screen it is when the
   app is opened — nothing added, nothing highlighted — so the tabs live here,
   where they say which mode you are in and offer the way out. */
function tabBar(){
  if(!inAdmin()) return "";
  return `<div class="tabs noprint">
    <button onclick="exitAdmin()">${tr("tab_factory")}</button>
    <button class="on">${tr("tab_admin")}</button>
  </div>`;
}

/* Leaving Admin locks it again: the way back in is the code, the same way in as
   the first time. Everything Admin touched is cleared, so what appears is the
   start screen exactly as it opens — no reference chosen, no test selection
   left behind, no field pre-filled. */
/* The code currently in use, for the header. A factory account shows its own,
   never the admin one. */
function adminCode(){
  if(!ADMIN_FACTORY) return ADMIN_ID.code;
  const hit = Object.keys(FACTORY_ADMINS)
    .find(d => FACTORY_ADMINS[d].key === ADMIN_FACTORY);
  return hit ? FACTORY_ADMINS[hit].code : "";
}

function exitAdmin(){
  ADMIN_OK = false;
  // ADMIN_FACTORY is left alone on purpose: see where it is declared.
  S.adminQuery = "";
  S.pick = null; S.fromAdmin = false;
  S.idDigits = ""; S.testId = ""; S.factory = ""; S.model = "";
  S.screen = "setup";
  window.scrollTo(0,0);
  render();
}
/* Back to the reference list. Without the session flag there is no Admin to go
   back to, so this lands on the start screen instead. */
function goAdminTab(){
  if(!ADMIN_OK){ exitAdmin(); return; }
  S.screen = "admin";
  window.scrollTo(0,0);
  render();
}

function renderAdmin(){
  // Reached only through the code. A reload drops the session flag, so this
  // sends anyone who lands here without it back to the start screen.
  if(!ADMIN_OK){ S.screen = "setup"; renderSetup(); return; }

  const list = refList();

  app.innerHTML = `
    ${langBar()}
    <h1>HOKLAN QC</h1>
    <p class="sub">${tr("tab_admin")}</p>
    ${tabBar()}
    <div class="card">
      <div class="tag">${esc(adminCode())}</div>
      ${isFactoryUser()?`<div class="tag" style="background:rgba(245,185,66,.16);
        border-color:var(--amber);color:var(--amber)">${tr("factory_mode")}</div>`:""}
      <label>${tr("admin_refs")}</label>
      <input id="q" value="${esc(S.adminQuery)}" placeholder="${tr("search")}"
        autocomplete="off" oninput="setAdminQuery(this.value)">
      <p class="hint" id="qhint">${fmt("admin_refs_hint",{n:list.length})}</p>
      <div class="rlist" id="rlist">${refRows(list)}</div>
    </div>`;
  actions.innerHTML =
    `<button onclick="exitAdmin()">${tr("to_start")}</button>`;
}

/* The references the filter currently leaves. A factory account never sees past
   its own catalogue: the filter is applied before the text search, so no query
   can reach a reference that belongs to somebody else. */
function refList(){
  const q = String(S.adminQuery || "").trim().toUpperCase();
  let all = Object.keys(CONFIG.models).sort();
  if(ADMIN_FACTORY) all = all.filter(m => keyOfModel(m) === ADMIN_FACTORY);
  return q ? all.filter(m => m.toUpperCase().indexOf(q) >= 0) : all;
}
function refRows(list){
  if(!list.length) return `<p class="hint" style="margin:0">${tr("no_match")}</p>`;
  return list.map(m => {
    // Belt and braces on top of the filter above: a test ID is only ever printed
    // next to a reference of the factory that is logged in.
    const code = (!ADMIN_FACTORY || keyOfModel(m) === ADMIN_FACTORY)
      ? codeOfModel(m) : "";
    return `<button onclick="adminOpen('${esc(m)}')">
      <span>${esc(m)}</span><em>${esc(code)}</em></button>`;
  }).join("");
}

/* Filtering must not rebuild the input being typed into, so the list and its
   count are patched in place and the field is left alone. Both are addressed by
   id: the empty result is a message inside the same container, so there is
   always something to write into — a filter that matched nothing used to leave
   the previous list on screen. */
function setAdminQuery(value){
  S.adminQuery = value;
  const list = refList();
  const hint = document.getElementById("qhint");
  const box = document.getElementById("rlist");
  if(hint) hint.innerHTML = fmt("admin_refs_hint",{n:list.length});
  if(box) box.innerHTML = refRows(list);
}

/* The reference decides the factory, and each factory has exactly one test ID,
   so picking a reference in Admin fills in the code the report has to carry —
   there is nothing for the operator to type and nothing to get wrong. */
const keyOfModel = m => CONFIG.models[m] || "";
function digitsOfKey(key){
  return Object.keys(CONFIG.test_ids)
    .find(d => CONFIG.test_ids[d].key === key) || "";
}
function codeOfModel(m){
  const d = digitsOfKey(keyOfModel(m));
  return d ? CONFIG.test_ids[d].code : "—";
}

function adminOpen(model){
  S.model = model;
  S.factory = keyOfModel(model);
  S.idDigits = digitsOfKey(S.factory);
  S.testId = S.idDigits ? CONFIG.test_ids[S.idDigits].code : "";
  // Everything ticked to begin with: the common case is "all of it, on this
  // reference", and unticking three is less work than ticking eleven.
  S.pick = planTests().map(t => t.id);
  S.screen = "adminPick";
  window.scrollTo(0,0);
  render();
}

/* Read the form back before any rebuild, exactly as setUnits does: the fields
   sit above the controls that trigger a render and would be silently cleared. */
function readAdminForm(){
  S.po = (document.getElementById("po")||{}).value || S.po;
  S.operator = (document.getElementById("operator")||{}).value || S.operator;
}

function togglePick(id){
  readAdminForm();
  S.pick = S.pick || [];
  const i = S.pick.indexOf(id);
  if(i >= 0) S.pick.splice(i,1); else S.pick.push(id);
  render();
}
function pickAll(on){
  readAdminForm();
  S.pick = on ? planTests().map(t => t.id) : [];
  render();
}

function renderAdminPick(){
  const all = planTests();
  const picked = S.pick || [];
  const rows = all.map(t => {
    const on = picked.indexOf(t.id) >= 0;
    const n = realPoints(t).length;
    return `<button class="pk ${on?"on":""}" onclick="togglePick('${t.id}')">
      <i>${on?"✓":""}</i><b>${esc(L(t.label))}</b>
      <em>${fmt("points_n",{n})}${t.optional?" · "+tr("is_optional"):""}</em>
    </button>`;
  }).join("");

  app.innerHTML = `
    ${langBar()}
    <h1>HOKLAN QC</h1>
    <p class="sub">${tr("tab_admin")}</p>
    ${tabBar()}
    <div class="card">
      <div class="tag">${esc(S.model)}</div><div class="tag">${esc(S.testId)}</div>
      <div class="tag">${esc(inspectionDate())}</div>
      <label>${tr("tests_pick")}</label>
      <div class="row" style="margin-bottom:8px">
        <button onclick="pickAll(true)">${tr("all_on")}</button>
        <button onclick="pickAll(false)">${tr("all_off")}</button>
      </div>
      ${rows}
      <p class="hint">${fmt("n_selected",{n:picked.length, tot:all.length})}</p>
    </div>
    <div class="card">
      <label style="margin-top:0">${tr("po")}</label>
      <input id="po" value="${esc(S.po)}" placeholder="1693"
        inputmode="numeric" maxlength="12" autocomplete="off"
        oninput="onlyDigits(this)">
      <label>${tr("operator")}</label>
      <input id="operator" value="${esc(S.operator)}" maxlength="40"
        autocomplete="off" oninput="onlyLetters(this)">
      <label>${tr("units")}</label>
      <div class="units">${Array.from({length:MAX_UNITS},(_,i)=>
        `<button class="${S.units===i+1?"on":""}"
          onclick="setUnitsAdmin(${i+1})">${i+1}</button>`).join("")}</div>
    </div>`;

  actions.innerHTML = `
    <button style="flex:0 0 40%" onclick="goAdminTab()">${tr("back")}</button>
    <button class="primary" style="flex:4${picked.length?"":";opacity:.5"}"
      onclick="adminStart()">${tr("admin_start")}</button>`;
}

function setUnitsAdmin(n){
  readAdminForm();
  S.units = Math.min(MAX_UNITS, Math.max(1, parseInt(n,10) || 1));
  render();
}

function adminStart(){
  readAdminForm();
  S.po = String(S.po||"").replace(/[^0-9]/g,"").trim();
  S.operator = String(S.operator||"")
    .replace(/[^\p{L}\p{M} .'’-]/gu,"").replace(/\s+/g," ").trim();
  if(!S.model || !S.testId){ alert(tr("a_select_model")); return; }
  if(!S.operator){ alert(tr("a_operator")); return; }
  if(!S.pick || !S.pick.length){ alert(tr("a_pick_tests")); return; }

  S.fromAdmin = true;
  S.selfCheck = isFactoryUser();
  S.index = 0; S.open = {};
  S.data = Array.from({length:S.units}, () => []);
  S.startedAt = Date.now(); S.screen = "test";
  window.scrollTo(0,0);
  render(); save();
}

/* Abort throws the inspection away on purpose — that is what it is for. It asks
   first, because what it discards is an hour of somebody's work. */
function abortTest(){
  if(!confirm(tr("a_abort"))) return;
  clearDraft();
  S.data = [[]]; S.units = 1; S.index = 0; S.open = {};
  S.startedAt = null; S.mediaDropped = false;
  S.pick = null; S.fromAdmin = false; S.selfCheck = false;
  S.screen = ADMIN_OK ? "admin" : "setup";
  window.scrollTo(0,0);
  render();
}

function langBar(mini){
  return `<div class="lang${mini?" mini noprint":""}">
    <button class="${LANG==="es"?"on":""}" onclick="setLang('es')">Español</button>
    <button class="${LANG==="en"?"on":""}" onclick="setLang('en')">English</button>
    <button class="${LANG==="zh"?"on":""}" onclick="setLang('zh')">中文</button>
  </div>`;
}

function renderSetup(){
  const valid = !!S.testId;
  const bad = S.idDigits.length === 3 && !valid;
  const list = valid ? modelsOf(S.factory) : [];
  const models = `<option value="">${tr("select")}</option>` +
    list.map(m=>`<option ${m===S.model?"selected":""}>${esc(m)}</option>`).join("");

  // Nothing about the references is shown until the code is valid: an invalid
  // code must reveal no part of the catalogue.
  const codeLine = valid
    ? `<div class="code ok">${esc(S.testId)}</div>`
    : bad ? `<div class="code bad">${tr("bad_id")}</div>` : "";

  app.innerHTML = `
    ${langBar()}
    <h1>HOKLAN QC</h1>
    <p class="sub">${tr("subtitle")}</p>
    <div class="card">
      <label>${tr("test_id")}</label>
      <input id="idDigits" inputmode="numeric" maxlength="3" autocomplete="off"
        placeholder="000" value="${esc(S.idDigits)}" oninput="setTestId(this.value)"
        class="${bad?"bad":""}"
        style="letter-spacing:6px;font-size:22px;text-align:center;font-weight:700">
      ${codeLine}
      ${valid?`
      <label>${tr("reference")}</label>
      <select id="model">${models}</select>`:""}
      <label>${tr("inspection")}</label>
      <input value="${esc(inspectionDate())}" readonly
             style="color:var(--muted);background:#0a1523">
      <label>${tr("po")}</label>
      <input id="po" value="${esc(S.po)}" placeholder="1693"
        inputmode="numeric" maxlength="12" autocomplete="off"
        oninput="onlyDigits(this)">
      <label>${tr("operator")}</label>
      <input id="operator" value="${esc(S.operator)}" maxlength="40"
        autocomplete="off" oninput="onlyLetters(this)">
      <label>${tr("units")}</label>
      <div class="units">${Array.from({length:MAX_UNITS},(_,i)=>
        `<button class="${S.units===i+1?"on":""}"
          onclick="setUnits(${i+1})">${i+1}</button>`).join("")}</div>
      <input id="units" class="hidden" value="${S.units}">
      <p class="hint">${fmt(S.units>1?"plan_info_n":"plan_info",
        {n:tests().length, v:plan().plan_version,
         u:S.units, tot:tests().length*S.units})}<br>
      ${tr("report_note")}</p>
    </div>
    <p class="hint" style="text-align:center;opacity:.6">HOKLAN QC v${APP_VERSION}</p>
    ${isFactoryUser()?"":`<p style="text-align:center">
      <button class="jump" style="text-align:center;width:100%;opacity:.7"
        onclick="wipeData()">${tr("wipe")}</button></p>`}`;
  actions.innerHTML = `<button class="primary" onclick="start()">${tr("start")}</button>`;
}

/* How many speakers this inspection covers. Kept on the setup screen only —
   changing it once the checklist has started would orphan answers already
   given, so the control is not offered later. */
function setUnits(n){
  S.units = Math.min(MAX_UNITS, Math.max(1, parseInt(n,10) || 1));
  // Everything already typed has to be read back before the form is rebuilt,
  // the reference select included — it sits above these buttons, so it is
  // normally filled in first and would otherwise be silently cleared.
  S.model = (document.getElementById("model")||{}).value || S.model;
  S.po = (document.getElementById("po")||{}).value || S.po;
  S.operator = (document.getElementById("operator")||{}).value || S.operator;
  render();
}

/* Typed characters are filtered as they are typed, without re-rendering: the
   caret is put back where it was, or the cursor jumps to the end mid-word on
   every keystroke. A purely numeric keypad is not enough — the operator can
   still paste, and some Chinese keyboards ignore inputmode entirely. */
function filterInput(el, re){
  const at = el.selectionStart;
  const before = el.value;
  const after = before.replace(re, "");
  if(after === before) return;
  el.value = after;
  const back = before.length - after.length;
  try{ el.setSelectionRange(Math.max(0, at - back), Math.max(0, at - back)); }
  catch(e){}
}
function onlyDigits(el){ filterInput(el, /[^0-9]/g); }
// Letters of any script, plus what a person's name legitimately contains.
function onlyLetters(el){ filterInput(el, /[^\p{L}\p{M} .'’-]/gu); }

function setTestId(value){
  const digits = String(value).replace(/\D/g,"").slice(0,3);

  // The admin code is not a factory. It is consumed here — the field is left
  // empty and nothing is stored — so it can never reach a report, a file name
  // or the spreadsheet the way a real test ID does.
  if(digits === ADMIN_ID.digits){
    ADMIN_OK = true; ADMIN_FACTORY = "";
    S.idDigits = ""; S.testId = ""; S.factory = ""; S.model = "";
    S.screen = "admin";
    window.scrollTo(0,0);
    render();
    return;
  }

  // A factory account: the same Admin screens, restricted to one factory.
  const fa = FACTORY_ADMINS[digits];
  if(fa){
    ADMIN_OK = true; ADMIN_FACTORY = fa.key;
    S.idDigits = ""; S.testId = ""; S.factory = ""; S.model = "";
    S.screen = "admin";
    window.scrollTo(0,0);
    render();
    return;
  }

  const entry = CONFIG.test_ids[digits];
  const newKey = entry ? entry.key : "";

  const wasBad = S.idDigits.length === 3 && !S.testId;
  const isBad = digits.length === 3 && !entry;

  S.idDigits = digits;
  S.testId = entry ? entry.code : "";

  // Rebuild only when what is on screen actually changes: the reference list
  // appearing or disappearing, or the error state flipping. Re-rendering on
  // every keystroke would fight the operator typing.
  if(newKey !== S.factory || isBad !== wasBad){
    S.factory = newKey;
    S.model = "";
    S.po = (document.getElementById("po")||{}).value || S.po;
    S.operator = (document.getElementById("operator")||{}).value || S.operator;
    render();
    const box = document.getElementById("idDigits");
    if(box && !entry){
      box.focus();
      box.setSelectionRange(box.value.length, box.value.length);
    }
  }
}

function start(){
  const sel = document.getElementById("model");
  S.model = sel ? sel.value : "";
  S.po = document.getElementById("po").value.replace(/[^0-9]/g,"").trim();
  S.operator = document.getElementById("operator").value
    .replace(/[^\p{L}\p{M} .'’-]/gu,"").replace(/\s+/g," ").trim();
  if(!S.testId){ alert(tr("a_select_factory")); return; }
  if(!S.model){ alert(tr("a_select_model")); return; }
  if(!S.operator){ alert(tr("a_operator")); return; }
  const un = document.getElementById("units");
  S.units = un ? Math.min(MAX_UNITS, Math.max(1, parseInt(un.value,10)||1)) : 1;
  // The factory flow always runs the whole plan: any selection left over from
  // an Admin session is dropped here, or a partial plan would leak into a
  // normal inspection and report as if it were complete.
  S.pick = null; S.fromAdmin = false; S.selfCheck = false;
  S.index = 0; S.open = {};
  S.data = Array.from({length:S.units}, () => []);
  S.startedAt = Date.now(); S.screen = "test";
  render(); save();
}

function goHomeReset(){
  S.idDigits = ""; S.testId = ""; S.factory = ""; S.model = "";
}

/* Wipe everything the app is holding, so the next report starts from an empty
   sheet: no leftover answers, no leftover photos, no half-finished draft. */
function wipeData(){
  if(!confirm(tr("a_wipe"))) return;
  clearDraft();
  S.data = [[]]; S.units = 1; S.index = 0; S.open = {};
  S.po = ""; S.operator = ""; S.startedAt = null; S.mediaDropped = false;
  S.pick = null; S.fromAdmin = false;
  S.screen = "setup";
  goHomeReset();
  window.scrollTo(0,0);
  render();
  alert(tr("a_wiped"));
}

function header(t, done, total){
  return `
    ${langBar(true)}
    ${S.units > 1 ? `<div class="unit-tag">${
      fmt("units_tag",{n:S.units})}</div>` : ""}
    <div class="tag">${esc(S.testId)}</div><div class="tag">${esc(S.model)}</div>
    <div class="tag">${esc(inspectionDate(S.startedAt))}</div>
    <div class="bar"><i style="width:${(done/total*100).toFixed(0)}%"></i></div>
    <h2>${done+1} / ${total} · ${esc(L(t.label))}</h2>
    <button class="jump" onclick="showIndex()">${tr("go_other")}</button>`;
}

/* Only a targeted inspection launched from Admin can be walked out of. In the
   factory flow the way out is finishing, or the home button with its warning —
   an operator does not get a one-tap discard next to the checklist. */
function abortBlock(){
  return S.fromAdmin ? `<p style="text-align:center;margin:0">
    <button class="jump" style="width:100%;color:var(--red);border-color:#7a3a36"
      onclick="abortTest()">${tr("abort")}</button></p>` : "";
}

function mediaBlock(r){
  return `<div class="media">${r.media.filter(m=>!m.slot).map(m=>`
    <div class="thumb">
      ${m.kind==="photo"?`<img src="${m.url}">`:`<video src="${m.url}" muted></video>`}
      <b>${m.kind==="photo"?tr("photo"):tr("video")}</b>
      <span onclick="dropMedia('${m.uid}')">×</span>
    </div>`).join("")}</div>`;
}

/* One point, one speaker: the label, the three buttons, and — when it failed —
   its own evidence box. Rendered once per speaker under the same question, so
   the operator answers the question for each unit on the bench without losing
   sight of what the question is. */
function pointRow(p, u, showTag){
  const r = row(u);
  const v = r.points[p.id];
  const shots = shotsFor(r, p.id);
  const note = (r.notes && r.notes[p.id]) || "";
  const noteEn = appTrLine(r, "note", p.id);
  const evOk = shots.length > 0 && note.trim() !== "";
  const id = u + "_" + p.id;

  // Once the evidence is complete the box folds into one green line, so a test
  // with four failures does not become four screens of thumbnails. It reopens
  // with a tap. Folding happens on the next render, never while the operator is
  // typing — that would close the phone keyboard.
  const fold = v === "FAIL" && evOk && !failBoxOpen(u, p.id, evOk) ? `
    <div class="pf-c" onclick="toggleFail(${u},'${p.id}',true)">
      <b>✓</b><span>${esc(evSummary(shots, note))}</span><i>▸</i>
    </div>` : "";

  const fail = v === "FAIL" && !fold ? `
    <div class="pf">
      <div class="pf-h">${tr("fail_evidence")}${showTag?
        " · " + fmt("speaker_n",{n:u+1}):""}</div>
      <div class="row">
        <button onclick="document.getElementById('pc_${id}').click()">📷 ${tr("photo")}</button>
        <button onclick="document.getElementById('pv_${id}').click()">🎥 ${tr("video")}</button>
      </div>
      <input id="pc_${id}" class="hidden" type="file" accept="image/*"
        capture="environment" multiple onchange="addMedia(this,${u},'${p.id}')">
      <input id="pv_${id}" class="hidden" type="file" accept="video/*"
        capture="environment" multiple onchange="addMedia(this,${u},'${p.id}')">
      <div class="media">${shots.map(m=>`
        <div class="thumb">
          ${m.kind==="photo"?`<img src="${m.url}">`:`<video src="${m.url}" muted></video>`}
          <b>${m.kind==="photo"?tr("photo"):tr("video")}</b>
          <span onclick="dropMedia('${m.uid}')">×</span>
        </div>`).join("")}</div>
      <textarea placeholder="${tr("notes_fail_ph")}"
        oninput="noteTyped(${u},'${p.id}', this.value)"
        onblur="setTimeout(function(){closeFail(${u},'${p.id}')},180)">${esc(note)}</textarea>
      <div id="en_${id}" class="en-line${noteEn?"":" hidden"}">${
        noteEn?esc(noteEn):""}</div>
      <div id="pfw_${id}" class="${evOk?"pf-ok":"pf-w"}">${
        evOk?tr("fail_ready"):tr("fail_required")}</div>
    </div>` : "";

  return `<div class="pt">
      ${showTag?`<u>${fmt("speaker_n",{n:u+1})}</u>`:""}
      <span>${esc(L(p.label))}</span>
      <button class="${v==="PASS"?"on-p":""}" onclick="setPoint(${u},'${p.id}','PASS')">✓</button>
      <button class="${v==="FAIL"?"on-f":""}" onclick="setPoint(${u},'${p.id}','FAIL')">✗</button>
      <button class="na-btn ${v==="NA"?"on-n":""}" onclick="setPoint(${u},'${p.id}','NA')"
        title="${tr("na_title")}">N/A</button></div>
    ${fail}${fold}`;
}

function renderTest(){
  const t = current();
  const done = S.index, total = tests().length;

  if(t.type === "photos") return renderPhotoTest(t, row(0), done, total);

  const shared = row(0);      // test-level evidence and notes live on speaker 1
  const sharedEn = appTrLine(shared, "comment");
  const pending = pendingCount();
  const needsPhoto = missingEvidence(0).photo;
  const needsVideo = missingEvidence(0).video;
  // A failure without its photo and its note is as blocking as an unanswered
  // point, so the Next button has to dim for it too.
  let openFails = 0;
  allUnits().forEach(u => realPoints(t).forEach(p => {
    if(failOpen(row(u), p)) openFails++;
  }));
  const ready = pending === 0 && !needsPhoto && !needsVideo && openFails === 0;
  const many = S.units > 1;

  const groups = sectionsOf(t).map(sec => {
    const tot = sec.points.length * S.units;
    let ans = 0, bad = 0;
    allUnits().forEach(u => sec.points.forEach(p => {
      const v = row(u).points[p.id];
      if(ANSWERED.indexOf(v) >= 0) ans++;
      if(v === "FAIL") bad++;
    }));
    const open = sectionOpen(sec.name, ans, tot);
    const badge = bad ? `<em class="bad">${bad} ✗</em>`
                : ans===tot ? `<em class="ok">✓ ${tot}</em>` : `<em>${ans}/${tot}</em>`;
    const rows = sec.points.map(p => {
      const ph = L(p.help);
      const pOpen = pointHelpOpen(p.id);
      // The question is written once; the speakers hang underneath it.
      return `<div class="q">
        ${many?`<div class="q-h">${esc(L(p.label))}</div>`:""}
        ${allUnits().map(u => pointRow(p, u, many)).join("")}
        ${ph?`<button class="p-help ${pOpen?"on":""}"
          onclick="togglePointHelp('${p.id}')">${pOpen?"−":"+"} ${tr("how_to")}</button>`:""}
        ${pOpen&&ph?`<div class="pt-help">${esc(ph)}</div>`:""}
      </div>`;
    }).join("");
    const cls = bad ? "bad" : ans===tot ? "done" : "";
    const safe = String(sec.name).replace(/['"\\]/g,"");
    const hOpen = helpOpen(sec.name);
    return `<div class="grp ${cls}">
      <div class="grp-h">
        <b onclick="toggleSection('${safe}',${ans},${tot})">${esc(sec.name || tr("checks"))}</b>
        ${badge}
        ${sec.help?`<button class="help-b ${hOpen?"on":""}"
          onclick="toggleHelp('${safe}')">${hOpen?"−":"+"}</button>`:""}
        <i onclick="toggleSection('${safe}',${ans},${tot})">${open?"▾":"▸"}</i>
      </div>
      ${hOpen&&sec.help?`<div class="grp-help">${esc(sec.help)}</div>`:""}
      ${open?`<div class="grp-b">${rows}</div>`:""}</div>`;
  }).join("");

  app.innerHTML = `
    ${header(t, done, total)}
    <p class="hint" id="hint" style="margin:0 0 10px">${hintHtml(t)}</p>
    ${groups}
    <div class="card">
      <label style="margin-top:0">${tr("evidence")}${needsPhoto||needsVideo?
        ` <span style="color:var(--amber)">${tr("required")}</span>`:""}</label>
      <ul class="ask">
        <li><b>${tr("video")}</b> ${tr("ask_video")}${needsVideo
          ? ` <b style="color:var(--amber)">${tr("required")}</b>`
          : ` <b style="color:var(--green)">✓</b>`}</li>
        <li><b>${tr("photo")}</b> ${tr("ask_photo")}${needsPhoto
          ? ` <b style="color:var(--amber)">${tr("required")}</b>`
          : ` <b style="color:var(--green)">✓</b>`}</li>
      </ul>
      <div class="row">
        <button onclick="document.getElementById('cam').click()">📷 ${tr("photo")}</button>
        <button onclick="document.getElementById('vid').click()">🎥 ${tr("video")}</button>
      </div>
      <input id="cam" class="hidden" type="file" accept="image/*" capture="environment" multiple onchange="addMedia(this,0)">
      <input id="vid" class="hidden" type="file" accept="video/*" capture="environment" multiple onchange="addMedia(this,0)">
      ${mediaBlock(shared)}
      ${needsPhoto||needsVideo?`<div class="needed">${
        needsPhoto && needsVideo ? tr("need_both")
        : needsVideo ? tr("need_video")
        : (many ? tr("need_photo_n") : tr("need_photo"))}</div>`:""}
    </div>
    <div class="card">
      <label style="margin-top:0">${tr("notes")} ${tr("optional")}</label>
      <textarea id="comment" placeholder="${tr("notes_ph")}"
        oninput="commentTyped(this.value)">${esc(shared.comment)}</textarea>
      <div id="en_comment" class="en-line${sharedEn?"":" hidden"}">${
        sharedEn?esc(sharedEn):""}</div>
    </div>
    ${abortBlock()}`;

  actions.innerHTML = `
    ${done>0?`<button class="skip" style="flex:0 0 52px" onclick="prevTest()">‹</button>`:""}
    <button class="primary" id="btn-next" style="flex:4${ready?"":";opacity:.5"}" onclick="nextTest()">
      ${done+1===total?tr("finish"):tr("next")}</button>
    ${t.optional?`<button class="skip" style="flex:0 0 66px" onclick="skipTest()">${tr("na")}</button>`:""}`;
}

/* Typing a note cannot trigger a full render — the textarea would be rebuilt
   and the phone keyboard would close on every keystroke. So the three things
   that depend on that note are patched in place instead. */
const failOpen = (r,p) => r.points[p.id] === "FAIL" &&
  (shotsFor(r,p.id).length === 0 || !((r.notes && r.notes[p.id]) || "").trim());

/* The evidence every test has to be left with: one photo *and* one clip of it
   being run. Both are demanded because they answer different questions — the
   photo shows the setup and the tools used, the video shows the speaker
   actually working. Evidence of a specific defect carries a slot and is
   accounted for on its own point, so it does not count here. */
function missingEvidence(u){
  const gen = row(u || 0).media.filter(m => !m.slot);
  return {photo: !gen.some(m => m.kind === "photo"),
          video: !gen.some(m => m.kind === "video")};
}
function evidenceComplete(){
  const m = missingEvidence(0);
  return !m.photo && !m.video;
}

function openFailCount(t){
  let n = 0;
  allUnits().forEach(u => realPoints(t).forEach(p => {
    if(failOpen(row(u), p)) n++;
  }));
  return n;
}

function hintHtml(t){
  const pending = pendingCount();
  if(pending) return fmt("remaining",{n:pending});
  const open = openFailCount(t);
  return open ? `<b style="color:var(--red)">${fmt("open_fails",{n:open})}</b>`
              : `<b style="color:var(--green)">${tr("all_done")}</b>`;
}

function syncFail(u, pointId){
  const t = current();
  if(!t || t.type === "photos") return;

  const p = realPoints(t).find(x => x.id === pointId);
  const box = document.getElementById("pfw_" + u + "_" + pointId);
  if(p && box){
    const ok = !failOpen(row(u), p);
    box.className = ok ? "pf-ok" : "pf-w";
    box.textContent = ok ? tr("fail_ready") : tr("fail_required");
  }

  const hint = document.getElementById("hint");
  if(hint) hint.innerHTML = hintHtml(t);

  const btn = document.getElementById("btn-next");
  if(btn){
    const ready = pendingCount() === 0 &&
      evidenceComplete() && openFailCount(t) === 0;
    btn.style.opacity = ready ? "" : ".5";
  }
}

function renderPhotoTest(t, r, done, total){
  const rEn = appTrLine(r, "comment");
  const items = realPoints(t);
  const missing = items.filter(p =>
    shotsFor(r,p.id).length === 0 && (t.no_na || r.points[p.id] !== "NA")).length;

  const allowNA = !t.no_na;

  const rows = items.map(p => {
    const shots = shotsFor(r,p.id);
    const na = allowNA && r.points[p.id] === "NA";
    const ph = L(p.help);
    const pOpen = pointHelpOpen(p.id);
    return `<div class="shot ${shots.length||na?"ok":""}">
      <div class="shot-head"><b>${esc(L(p.label))}</b>
        ${shots.length?`<em>${shots.length}</em>`:
          na?`<em class="na">N/A</em>`:`<em class="miss">${tr("required").replace("— ","")}</em>`}
      </div>
      ${ph?`<button class="p-help ${pOpen?"on":""}"
        onclick="togglePointHelp('${p.id}')">${pOpen?"−":"+"} ${tr("how_to")}</button>`:""}
      ${pOpen&&ph?`<div class="pt-help">${esc(ph)}</div>`:""}
      <div class="row">
        <button onclick="document.getElementById('s_${p.id}').click()">📷 ${tr("photo")}</button>
        ${allowNA?`<button class="${na?"on-n":""}" style="flex:0 0 66px"
          onclick="setPoint(0,'${p.id}','${na?"":"NA"}')">${tr("na")}</button>`:""}
      </div>
      <input id="s_${p.id}" class="hidden" type="file" accept="image/*"
        capture="environment" multiple onchange="addMedia(this,0,'${p.id}')">
      <div class="media">${shots.map(m=>`
        <div class="thumb"><img src="${m.url}">
          <span onclick="dropMedia('${m.uid}')">×</span></div>`).join("")}</div>
    </div>`;
  }).join("");

  app.innerHTML = `
    ${header(t, done, total)}
    <div class="card">
      <label style="margin-top:0">${tr("how_photos")}</label>
      <ol class="steps">${t.steps.map(s=>`<li>${esc(L(s))}</li>`).join("")}</ol>
    </div>
    <p class="hint" style="margin:0 0 10px">${missing?
      fmt("remaining",{n:missing}) :
      `<b style="color:var(--green)">${tr("all_done")}</b>`}</p>
    ${rows}
    <div class="card">
      <label style="margin-top:0">${tr("notes")} ${tr("optional")}</label>
      <textarea id="comment" placeholder="${tr("notes_ph")}"
        oninput="commentTyped(this.value)">${esc(r.comment)}</textarea>
      <div id="en_comment" class="en-line${rEn?"":" hidden"}">${
        rEn?esc(rEn):""}</div>
    </div>
    ${abortBlock()}`;

  actions.innerHTML = `
    ${done>0?`<button class="skip" style="flex:0 0 52px" onclick="prevTest()">‹</button>`:""}
    <button class="primary" style="flex:4${missing?";opacity:.5":""}" onclick="nextTest()">
      ${done+1===total?tr("finish"):tr("next")}</button>
    ${t.optional?`<button class="skip" style="flex:0 0 66px" onclick="skipTest()">${tr("na")}</button>`:""}`;
}

function showIndex(){ S.screen = "index"; render(); }
function goTest(i){
  S.index = i; S.screen = "test";
  window.scrollTo(0,0);   // a new test must start at its first step
  render(); save();
}
function finish(){ S.screen = "done"; render(); save(); ensureTranslations(); }

function renderIndex(){
  const list = tests().map((t,i)=>{
    const r = (S.data[0]||[])[i];
    // A test counts as failed if it failed on any speaker, and as answered only
    // when every speaker has been answered.
    const total = realPoints(t).length * (t.type === "photos" ? 1 : S.units);
    let status = "—", cls = "";
    const verdicts = allUnits().map(u => ((S.data[u]||[])[i]||{}).verdict);
    if(i === S.index){ status = tr("here"); cls = "now"; }
    else if(r && r.verdict === "DOC"){ status = tr("photos_tag"); cls = "PASS"; }
    else if(verdicts.indexOf("FAIL") >= 0){ status = "FAIL"; cls = "FAIL"; }
    else if(r && r.verdict){ status = r.verdict; cls = r.verdict; }
    else {
      let n = 0;
      if(t.type === "photos"){
        if(r) n = realPoints(t).filter(p => shotsFor(r,p.id).length).length;
      } else {
        allUnits().forEach(u => {
          const ru = (S.data[u]||[])[i];
          if(ru) n += realPoints(t)
            .filter(p => ANSWERED.indexOf(ru.points[p.id])>=0).length;
        });
      }
      if(n) status = n + "/" + total;
    }
    const files = allUnits().reduce((a,u)=>
      a + (((S.data[u]||[])[i]||{}).media||[]).length, 0);
    return `<div class="ix" onclick="goTest(${i})">
      <b>${i+1}</b>
      <span>${esc(L(t.label))}
        <i>${fmt("points_n",{n:total})}${files?" · "+fmt("files_n",{n:files}):""}${
          t.optional?" · "+tr("is_optional"):""}</i></span>
      <em class="${cls}">${esc(status)}</em></div>`;
  }).join("");

  // Where each speaker stands. Read-only: the checklist is walked once, so
  // there is nothing to navigate to here — a tap would only mislead.
  const units = S.units < 2 ? "" : `
    <h2>${tr("by_unit")}</h2>
    <div class="card">${allUnits().map(i=>{
      const rows = unitRows(i);
      const doneN = rows.filter(r => r && r.verdict).length;
      const v = unitVerdict(rows);
      return `<div class="ix" style="cursor:default">
        <b>${i+1}</b>
        <span>${fmt("speaker_n",{n:i+1})}
          <i>${doneN}/${tests().length}</i></span>
        <em class="${v==="INCOMPLETE"?"":v}">${
          v === "INCOMPLETE" ? "—" : v}</em></div>`;
    }).join("")}</div>`;

  app.innerHTML = `${langBar(true)}
    ${units}
    <h2>${tr("tests_title")}</h2>
    <p class="hint" style="margin:0 0 12px">${tr("index_hint")}</p>
    <div class="card">${list}</div>`;

  const complete = allUnits().every(i => unitVerdict(unitRows(i)) !== "INCOMPLETE");
  actions.innerHTML = `
    <button class="primary" onclick="goTest(${Math.min(S.index, tests().length-1)})">
      ${tr("back_to_test")}</button>
    ${complete?`<button onclick="finish()">${tr("finish")}</button>`:""}`;
}

function renderDone(){
  const v = finalVerdict();
  const colour = v==="PASS"?"var(--green)":v==="FAIL"?"var(--red)":"var(--amber)";

  // One block per speaker: a lot that failed has to say which unit failed and
  // on what, or the operator has to reopen the report to find out.
  const blocks = allUnits().map(i=>{
    const rows = unitRows(i);
    const uv = unitVerdict(rows);
    const fails = [];
    // Indexed over the plan, not over the stored rows: a test never opened has
    // no row at all, and it has to show as pending rather than vanish.
    const table = tests().map((t,k)=>{
      const r = rows[k];
      if(r && r.verdict === "FAIL") fails.push({r, t});
      // The plan's label, not the one frozen when the operator answered:
      // switching language on this screen has to translate the table too.
      return `<tr><td>${esc(L(t.label))}</td>
        <td class="${r&&r.verdict!=="DOC"?r.verdict:""}">${
          esc(verdictText(r && r.verdict))}</td></tr>`;
    }).join("");
    return `<div class="card">
      ${S.units>1?`<div class="unit-tag">${fmt("speaker_n",{n:i+1})}</div>
        <span class="${uv}" style="font-weight:700">${verdictText(uv)}</span>`:""}
      <table>${table}</table>
      ${fails.length?`<div class="warn"><b>${tr("failures")}</b><br>${fails.map(f=>
        realPoints(f.t).filter(p => f.r.points[p.id] === "FAIL")
          .map(p => esc(p.code) + " — " + esc(L(p.label))).join("<br>")
      ).join("<br>")}</div>`:""}
    </div>`;
  }).join("");

  const files = allUnits().reduce((n,u)=>
    n + unitRows(u).reduce((m,r)=>m+(r?(r.media||[]).length:0),0), 0);
  const all = mediaList();
  const vids = all.filter(m => m.m.kind === "video").length;
  const pics = all.length - vids;

  app.innerHTML = `
    ${langBar(true)}
    <div class="big" style="color:${colour};border:2px solid ${colour}">${v}</div>
    <div class="card">
      <div class="tag">${esc(S.testId)}</div><div class="tag">${esc(S.model)}</div>
      <div class="tag">${esc(inspectionDate(S.startedAt))}</div>
      <div class="tag">${esc(S.operator)}</div>
      ${S.units>1?`<div class="tag">${fmt("units_tag",{n:S.units})}</div>`:""}
      <p class="hint">${fmt("evidence_total",{n:files,s:humanSize(evidenceBytes())})}</p>
      ${evidenceBytes() > 25*1048576 ? `<div class="warn">${tr("too_big")}</div>`:""}
      <button class="jump" onclick="showIndex()">${tr("review")}</button>
    </div>
    ${blocks}
    <div class="card">
      <label style="margin-top:0">${tr("packet")}</label>
      <ul class="packet">
        <li><b>REPORT_ES.html</b> ${tr("rm_report_es")}</li>
        <li><b>REPORT_EN.html</b> ${tr("rm_report_en")}</li>
        <li><b>REPORT_ZH.html</b> ${tr("rm_report_zh")}</li>
        <li><b style="word-break:break-all">${esc(packetName())}.csv</b>
          ${tr("rm_csv")}</li>
        ${pics?`<li><b>photos/</b> ${fmt("rm_photos",{n:pics})}</li>`:""}
        ${vids?`<li><b>videos/</b> ${fmt("rm_videos",{n:vids})}</li>`:""}
      </ul>
      <p class="hint" style="margin-top:0">${tr("rm_naming")}</p>
      <p class="hint" style="margin-top:0">${tr("packet_note")}</p>
      ${!CAN_DOWNLOAD?`<p class="hint">${
        fmt("dl_no",{w: IS_WECHAT?tr("in_wechat"):IS_IOS?tr("in_ios"):""})}</p>`:""}
      <button class="jump" onclick="showReport()">${tr("open_report")}</button>
      <div id="saved" class="warn hidden"
        style="background:rgba(20,102,58,.45);border-color:var(--green)"></div>
    </div>`;

  actions.innerHTML = `
    <button class="primary" onclick="savePdfNow()">${tr("save_pdf_dl")}</button>
    <button style="flex:0 0 44%" onclick="downloadPacket()">${tr("download")}</button>`;
}

function renderReport(){
  // Reuse the report's own stylesheet so the preview matches the PDF exactly.
  const full = reportHtml();
  const css = (full.match(/<style>([\s\S]*?)<\/style>/) || ["",""])[1];
  const body = full.replace(/^[\s\S]*<body>/, "").replace(/<\/body>[\s\S]*$/, "");

  app.innerHTML = `
    ${langBar(true)}
    <div class="card noprint">
      <label style="margin-top:0">${tr("save_pdf")}</label>
      <p class="hint" style="margin-top:0">${tr("pdf_how")}</p>
      <button class="jump" onclick="printReport()">${tr("save_pdf_btn")}</button>
    </div>
    <div id="report"><style>${css}</style>${body}</div>`;
  actions.innerHTML = `
    <button class="primary" onclick="printReport()">${tr("save_pdf")}</button>
    <button onclick="backToDone()">${tr("back")}</button>`;
}
function backToDone(){ S.screen = "done"; render(); }

/* ---------- back to the start screen -------------------------------------- */
function goHome(){
  // An inspection in progress is real work; never discard it on one tap.
  const working = S.screen !== "setup" &&
    S.data.some(u => (u || []).some(r => r));
  if(working && !confirm(tr("a_home"))) return;

  clearDraft();
  S.screen = "setup"; S.index = 0; S.units = 1;
  S.data = [[]]; S.open = {};
  S.startedAt = null; S.mediaDropped = false;
  S.pick = null; S.fromAdmin = false; S.selfCheck = false;
  goHomeReset();
  window.scrollTo(0,0);
  render();
}

const topBtn = document.getElementById("toTop");
function updateTopBtn(){
  // Not in Admin: the tabs are already the way back, and a HOME button next to
  // them would just be a second one that does something slightly different.
  const show = S.screen !== "setup" && !inAdmin();
  topBtn.className = "totop" + (show ? " show" : "");
  topBtn.textContent = tr("home");
}

/* ---------- boot ---------------------------------------------------------- */
document.documentElement.lang = LANG === "zh" ? "zh-CN" : LANG;

if(restore()){
  const lost = S.mediaDropped ? tr("a_lost") : "";
  if(confirm(tr("a_resume") + lost)){ S.mediaDropped = false; }
  else {
    clearDraft(); S.screen="setup"; S.data=[[]]; S.units=1;
    S.index=0; S.mediaDropped=false; goHomeReset();
  }
}
render();

window.addEventListener("beforeunload", e => {
  if(S.screen === "test"){ e.preventDefault(); e.returnValue = ""; }
});
updateTopBtn();
</script>
</body>
